<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f6fb;color:#202532}
button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}
aside{width:235px;background:#263454;color:#fff;padding:18px;position:sticky;top:0;height:100vh}
h1{font-size:22px;margin:0 0 22px}
.nav{width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#e3e8f6;text-align:left;font-size:14px;cursor:pointer;margin:2px 0}
.nav:hover,.nav.active{background:#3d4d73}
.status{position:absolute;bottom:18px;font-size:12px;color:#cbd4e9;max-width:195px}
main{flex:1;padding:26px;max-width:1500px;margin:auto;width:100%}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
h2{margin:0} header p{margin:4px 0;color:#697386}
.card,.student,.alert{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0000000c}
.card{margin-bottom:14px}
.alert{border-left:4px solid #dba83d;margin-bottom:16px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.student h3{margin:0 0 12px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{padding:8px;border:1px solid #dce1eb;background:#fafbfe}
.quick span{font-size:11px;margin-left:3px}
.noteBtn{margin-top:10px;background:transparent;border:0;color:#425796}
.out{background:#fff5d8;padding:10px;border-radius:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.add{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
input,select,textarea{padding:9px;border:1px solid #ccd3df;border-radius:7px}
button{padding:8px 12px;border:1px solid #cbd2df;border-radius:7px;background:#fff;cursor:pointer}
button:hover{background:#eef2fa}
button.primary{background:#263454;color:#fff;border-color:#263454}
button.primary:hover{background:#1e2944}
textarea{width:100%;min-height:120px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px;border-bottom:1px solid #e7eaf0;text-align:left}
.grade{width:70px}
.toast{position:fixed;right:20px;top:18px;background:#263454;color:#fff;padding:12px;border-radius:8px;z-index:30}
.modalbg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20}
.modal{background:#fff;padding:22px;border-radius:12px;width:min(500px,90vw)}
.reportgrid{display:flex;gap:9px;flex-wrap:wrap}
.stat{background:#f1f4fa;border-radius:9px;padding:12px;min-width:100px;display:flex;flex-direction:column}
.stat b{font-size:24px}
.small{font-size:12px;color:#667085}
.appFooter{margin-top:32px;padding:14px 0 4px;text-align:center;color:#98a1b2;font-size:10px}
.viewToggle{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px}
.viewToggle button{font-size:13px}
.viewToggle .activeView{background:#263454;color:#fff;border-color:#263454}
.matrixWrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0000000c;overflow:auto;max-height:calc(100vh - 190px)}
.matrix{min-width:850px;border-collapse:separate;border-spacing:0}
.matrix th{position:sticky;top:0;background:#f5f7fb;z-index:2;font-size:12px;white-space:nowrap;text-align:center}
.matrix th span{font-weight:500}
.matrix td{text-align:center;padding:5px}
.matrix tr:hover td{background:#fafbfe}
.matrixBtn{width:36px;height:34px;padding:4px;font-size:17px}
.stickyName{position:sticky!important;left:0;background:#fff;z-index:3;text-align:left!important;min-width:180px}
.matrix th.stickyName{background:#f5f7fb}
.studentOut td{background:#fff9e8!important}
.studentOut .stickyName{background:#fff9e8!important}
.matrix small{color:#9a6b00}
.userCard{margin-top:18px;padding-top:14px;border-top:1px solid #44557c;font-size:12px}
.userCard .userName{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:6px 0;color:#fff}
.userCard button{font-size:12px;padding:6px 9px}
.loginScreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef1f8,#f7f8fc)}
.loginCard{width:min(430px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 12px 35px #26345424;text-align:center}
.loginCard h1{color:#263454;margin-bottom:8px}
.loginCard p{color:#667085;line-height:1.5}
.googleBtn{margin-top:16px;width:100%;padding:12px;font-weight:650;font-size:16px}
.loginError{margin-top:14px;color:#a62f2f;font-size:13px}
.loadingScreen{min-height:100vh;display:grid;place-items:center;color:#667085}
@media(max-width:750px){
 aside{width:62px;padding:8px} aside h1{font-size:0}.nav{font-size:0;text-align:center}.nav:first-letter{font-size:19px}
 .status,.userCard{display:none} main{padding:14px}.split{grid-template-columns:1fr}.quick span{display:none}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,doc,getDoc,setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,
  signInWithRedirect,getRedirectResult,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================
   FIREBASE SETUP
   ========================= */
const firebaseConfig={
  apiKey:"AIzaSyAum-USwVh7epu7X7gMuFjlGzszkPKPA7U",
  authDomain:"teacher-dashboard-b4441.firebaseapp.com",
  projectId:"teacher-dashboard-b4441",
  storageBucket:"teacher-dashboard-b4441.firebasestorage.app",
  messagingSenderId:"191461146682",
  appId:"1:191461146682:web:c30279a76a586db32af503"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);
const APP_VERSION="1.3.1";
const LOCAL_KEY="teacherDashboardV1";
const CLOUD_SUBCOLLECTION="dashboards";
const CLOUD_DOCUMENT="main";

/* Old public document used by version 1.3.0.
   This lets an existing user's current dashboard migrate into their
   authenticated account the first time they sign in. */
const LEGACY_COLLECTION="teacherDashboard";
const LEGACY_DOCUMENT="main";

const buttons=[
 ["tardy","⏰","Tardy","event"],
 ["phone","📱","Phone","event"],
 ["talking","🗣️","Excessive Talking","event"],
 ["outseat","🚶","Out of Seat","event"],
 ["sleeping","😴","Sleeping","event"],
 ["refusal","🚫","Not Working","event"],
 ["restroom","🚻","Restroom","timed"]
];

const seed={
 classes:[{id:"c1",name:"Period 1 – Honors Precalculus",studentIds:["s1","s2","s3"]}],
 students:[{id:"s1",name:"Abby Smith"},{id:"s2",name:"Ben Jones"},{id:"s3",name:"Chris Brown"}],
 buttons:buttons.map(([id,icon,label,type])=>({id,icon,label,type})),
 events:[],notes:[],schoolDays:[],totalSchoolDays:180,gradeCourses:[]
};

let data=loadLocal();
let page="live";
let selected=null;
let liveView=localStorage.teacherDashboardLiveView||"cards";
let currentUser=null;
let cloudStatus="Waiting for sign-in";
let cloudSaveTimer=null;
let cloudWriteInProgress=false;
let cloudSavePending=false;
let authBusy=false;
let loginError="";
let initializedUserData=false;

function loadLocal(){
  try{return {...seed,...JSON.parse(localStorage.getItem(LOCAL_KEY)||"{}")}}
  catch{return structuredClone(seed)}
}
function saveLocal(){
  localStorage.setItem(LOCAL_KEY,JSON.stringify(data));
}
function userDocRef(){
  if(!currentUser)return null;
  return doc(db,"users",currentUser.uid,CLOUD_SUBCOLLECTION,CLOUD_DOCUMENT);
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================
   AUTH
   ========================= */
window.signIn=async()=>{
  if(authBusy)return;
  authBusy=true;loginError="";render();
  try{
    await signInWithPopup(auth,provider);
  }catch(err){
    console.error("Google sign-in failed:",err);
    if(err.code==="auth/popup-blocked" || err.code==="auth/cancelled-popup-request"){
      try{await signInWithRedirect(auth,provider);return;}
      catch(redirectErr){loginError=redirectErr.message||"Google sign-in could not be started.";}
    }else if(err.code!=="auth/popup-closed-by-user"){
      loginError=err.message||"Google sign-in failed.";
    }
  }finally{
    authBusy=false;
    render();
  }
};

window.signOut=async()=>{
  if(!confirm("Sign out of Teacher Dashboard? Your cloud data will remain safely stored in your Google account."))return;
  try{await signOut(auth);}
  catch(err){console.error(err);alert("Could not sign out right now.");}
};

getRedirectResult(auth).catch(err=>{
  console.error("Redirect sign-in failed:",err);
  loginError=err.message||"Google sign-in failed.";
  render();
});

onAuthStateChanged(auth,async user=>{
  currentUser=user||null;
  initializedUserData=false;
  cloudSaveTimer&&clearTimeout(cloudSaveTimer);
  cloudSaveTimer=null;
  if(!currentUser){
    cloudStatus="Sign in required";
    render();
    return;
  }
  cloudStatus="Loading your dashboard...";
  render();
  await loadCloudData();
});

/* =========================
   CLOUD STORAGE
   ========================= */
async function loadCloudData(){
  if(!currentUser)return;
  try{
    const personalRef=userDocRef();
    const snap=await getDoc(personalRef);

    if(snap.exists() && snap.data()?.data){
      data={...seed,...snap.data().data};
      saveLocal();
      cloudStatus="Firebase synced";
    }else{
      /* Migration path from version 1.3.0's shared public document. */
      let migrated=false;
      try{
        const legacySnap=await getDoc(doc(db,LEGACY_COLLECTION,LEGACY_DOCUMENT));
        if(legacySnap.exists() && legacySnap.data()?.data){
          data={...seed,...legacySnap.data().data};
          saveLocal();
          await setDoc(personalRef,{
            data,
            createdAt:new Date().toISOString(),
            updatedAt:new Date().toISOString(),
            migratedFrom:"teacherDashboard/main"
          });
          migrated=true;
        }
      }catch(legacyErr){
        console.warn("Legacy migration skipped:",legacyErr);
      }

      if(migrated){
        cloudStatus="Firebase synced — dashboard migrated";
      }else{
        /* If there is local data from this browser, preserve it and
           make it this user's first cloud copy. */
        const hasMeaningfulLocalData=localStorage.getItem(LOCAL_KEY);
        if(hasMeaningfulLocalData){
          await setDoc(personalRef,{
            data,
            createdAt:new Date().toISOString(),
            updatedAt:new Date().toISOString()
          });
          cloudStatus="Firebase synced";
        }else{
          cloudStatus="Firebase ready — new dashboard";
        }
      }
    }
    initializedUserData=true;
  }catch(err){
    console.error("Firebase load failed:",err);
    cloudStatus="Firebase error — using local backup";
    initializedUserData=true;
  }
  render();
}

function save(){
  saveLocal();
  if(currentUser && initializedUserData)queueCloudSave();
}

function queueCloudSave(){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(cloudSaveNow,500);
}

async function cloudSaveNow(){
  if(!currentUser || !initializedUserData)return;
  cloudSavePending=true;
  if(cloudWriteInProgress)return;
  cloudWriteInProgress=true;
  try{
    while(cloudSavePending){
      cloudSavePending=false;
      cloudStatus="Saving to Firebase...";
      render();
      const snapshot=structuredClone(data);
      await setDoc(userDocRef(),{
        data:snapshot,
        updatedAt:new Date().toISOString(),
        ownerUid:currentUser.uid
      },{merge:true});
      cloudStatus="Firebase synced";
    }
  }catch(err){
    console.error("Firebase save failed:",err);
    cloudStatus="Saved locally — cloud sync failed";
  }finally{
    cloudWriteInProgress=false;
    render();
  }
}

/* =========================
   RENDERING
   ========================= */
function render(){
  if(!currentUser){
    $("#root").innerHTML=loginHTML();
    return;
  }
  $("#root").innerHTML=
    `<div class="app">
      <aside>
        <h1>🎓 Teacher<br>Dashboard</h1>
        ${nav()}
        <div class="status">☁️ ${esc(cloudStatus)}</div>
        <div class="userCard">
          <b>Signed in as</b>
          <span class="userName">${esc(currentUser.displayName||currentUser.email||"Google user")}</span>
          <button onclick="window.signOut()">Sign out</button>
        </div>
      </aside>
      <main>
        ${toastHTML()}
        ${pageHTML()}
        <footer class="appFooter">© 2026 Lindsay Shay &nbsp;•&nbsp; Version ${APP_VERSION}</footer>
      </main>
    </div>
    ${selected?modalHTML():""}`;

  document.querySelectorAll("[data-page]").forEach(b=>{
    b.onclick=()=>{page=b.dataset.page;render();}
  });
  bind();
}

function loginHTML(){
  return `<div class="loginScreen"><section class="loginCard">
    <div style="font-size:48px">🎓</div>
    <h1>Teacher Dashboard</h1>
    <p>Sign in with Google to securely access your Teacher Dashboard and sync your data to your Firebase account.</p>
    <button class="googleBtn primary" onclick="window.signIn()" ${authBusy?"disabled":""}>
      ${authBusy?"Signing in...":"G  Sign in with Google"}
    </button>
    ${loginError?`<div class="loginError">${esc(loginError)}</div>`:""}
    <p class="small" style="margin-top:20px">Your dashboard keeps a local backup in this browser as an extra safeguard.</p>
  </section></div>`;
}

function nav(){
  return [
    ["live","🏠","Live Class"],
    ["students","👥","Students & Classes"],
    ["calendar","🗓️","Calendar"],
    ["buttons","⚡","Quick Buttons"],
    ["grades","📚","Grades"],
    ["reports","📊","Reports"],
    ["settings","⚙️","Settings"]
  ].map(x=>`<button class="nav ${page===x[0]?"active":""}" data-page="${x[0]}">${x[1]} ${x[2]}</button>`).join("");
}
function currentClass(){return data.classes[0]||{id:"",name:"No class yet",studentIds:[]};}
function activeEvents(){return data.events.filter(e=>e.type==="timed"&&!e.end);}

let toast="";
function toastHTML(){
  return toast?`<div class="toast">${esc(toast)} <button onclick="window.clearToast()">×</button></div>`:"";
}
window.clearToast=()=>{toast="";render();}

function pageHTML(){
  return ({live,students,calendar,buttons:quickButtons,grades,reports,settings})[page]();
}

function live(){
  const cls=currentClass();
  const roster=data.students.filter(s=>cls.studentIds.includes(s.id));
  const active=activeEvents();
  const viewToggle=`<div class="viewToggle">
    <button class="${liveView==="cards"?"activeView":""}" onclick="window.setLiveView('cards')">▦ Cards</button>
    <button class="${liveView==="matrix"?"activeView":""}" onclick="window.setLiveView('matrix')">▤ Matrix</button>
  </div>`;
  const outAlert=active.length?`<div class="alert"><b>Students currently out:</b>
    ${active.map(e=>{let s=data.students.find(x=>x.id===e.studentId);return `<div style="padding:8px 0">${esc(s?.name)} — ${e.icon} ${esc(e.label)} <span data-timer="${e.start}"></span> <button onclick="window.returnEvent('${e.id}','returned')">↩ Return</button></div>`}).join("")}
  </div>`:"";

  if(liveView==="matrix"){
    return `<header><div><h2>${esc(cls.name)}</h2><p>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p></div><div>${viewToggle}<div class="card">🚪 ${active.length} currently out</div></div></header>
      ${outAlert}
      <div class="matrixWrap"><table class="matrix"><thead><tr>
        <th class="stickyName">Student</th>
        ${data.buttons.map(b=>`<th title="${esc(b.label)}">${b.icon}<br><span>${esc(b.label)}</span></th>`).join("")}
        <th>📝<br><span>Note</span></th>
      </tr></thead><tbody>
        ${roster.map(s=>{
          let out=active.find(e=>e.studentId===s.id);
          return `<tr class="${out?"studentOut":""}">
            <td class="stickyName"><b>${esc(s.name)}</b>${out?`<br><small>OUT ${out.icon}</small>`:""}</td>
            ${data.buttons.map(b=>`<td><button class="matrixBtn" title="${esc(b.label)}" onclick="window.record('${s.id}','${b.id}')">${b.icon}</button></td>`).join("")}
            <td><button class="matrixBtn" onclick="window.note('${s.id}',null)">📝</button></td>
          </tr>`;
        }).join("")}
      </tbody></table></div>`;
  }

  return `<header><div><h2>${esc(cls.name)}</h2><p>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p></div><div>${viewToggle}<div class="card">🚪 ${active.length} currently out</div></div></header>
    ${outAlert}
    <div class="roster">${roster.map(s=>{
      let out=active.find(e=>e.studentId===s.id);
      return `<article class="student"><h3>${esc(s.name)}</h3>
        ${out?`<div class="out">🟡 OUT — <span data-timer="${out.start}"></span><button onclick="window.returnEvent('${out.id}','returned')">Return</button></div>`
        :`<div class="quick">${data.buttons.map(b=>`<button onclick="window.record('${s.id}','${b.id}')">${b.icon}<span>${esc(b.label)}</span></button>`).join("")}</div>`}
        <button class="noteBtn" onclick="window.note('${s.id}',null)">📝 Add Note</button>
      </article>`;
    }).join("")}</div>`;
}

window.setLiveView=v=>{liveView=v;localStorage.teacherDashboardLiveView=v;render();};

function students(){
  return `<header><h2>Students & Classes</h2></header>
  <div class="split">
    <section class="card"><h3>Students</h3>
      <div class="add"><input id="newStudent" placeholder="Student name"><button onclick="window.addStudent()">Add</button></div>
      ${data.students.map(s=>`<p>${esc(s.name)}</p>`).join("")}
    </section>
    <section class="card"><h3>Classes</h3>
      <div class="add"><input id="newClass" placeholder="Class name"><button onclick="window.addClass()">Add</button></div>
      ${data.classes.map(c=>`<div class="card"><b>${esc(c.name)}</b><div>
        ${data.students.map(s=>`<label class="small"><input type="checkbox" ${c.studentIds.includes(s.id)?"checked":""} onchange="window.roster('${c.id}','${s.id}',this.checked)"> ${esc(s.name)}</label><br>`).join("")}
      </div></div>`).join("")}
    </section>
  </div>`;
}

function calendar(){
  return `<header><h2>Calendar & Keystone Tracking</h2></header>
  <section class="card"><h3>School Day Calendar</h3><p>Map dates to instructional day numbers.</p>
    <div class="add"><input id="schoolDate" type="date"><input id="schoolDay" type="number" placeholder="School day #"><button onclick="window.addSchoolDay()">Add</button></div>
    <table><tr><th>Date</th><th>Day #</th></tr>
      ${[...data.schoolDays].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${x.day}</td></tr>`).join("")}
    </table>
  </section>
  <section class="card"><h3>Assignment Tracking</h3><p class="small">The data structure is ready for enrollment periods. We'll build the full enrolled/unenrolled report next.</p></section>`;
}

function quickButtons(){
  return `<header><h2>Quick Buttons</h2></header>
  <section class="card"><h3>Create a Quick Button</h3>
    <div class="add"><input id="qbIcon" value="⚡" style="width:70px"><input id="qbLabel" placeholder="Button name">
    <select id="qbType"><option value="event">One-time event</option><option value="timed">Timed event</option></select>
    <button onclick="window.addButton()">Add</button></div>
  </section>
  <div class="reportgrid">${data.buttons.map(b=>`<div class="card">${b.icon} <b>${esc(b.label)}</b><br><span class="small">${b.type}</span><button style="float:right" onclick="window.deleteButton('${b.id}')">Delete</button></div>`).join("")}</div>`;
}

function grades(){
  return `<header><h2>Grades & Analysis</h2></header>
  <div class="add"><input id="courseName" placeholder="Course name"><button onclick="window.addCourse()">Add Course</button></div>
  ${data.gradeCourses.map(c=>gradeCourse(c)).join("")}`;
}

function gradeCourse(c){
  let total=c.components.reduce((a,x)=>a+Number(x.weight||0),0);
  return `<section class="card"><h3>${esc(c.name)}</h3>
    <div class="add"><input id="comp-${c.id}" placeholder="Marking period/component"><input id="weight-${c.id}" type="number" placeholder="Weight %"><button onclick="window.addComponent('${c.id}')">Add</button></div>
    <p>Total configured weight: <b>${total}%</b></p>
    <table><tr><th>Student</th>${c.components.map(x=>`<th>${esc(x.name)} (${x.weight}%)</th>`).join("")}<th>Weighted</th></tr>
      ${data.students.map(s=>{
        let vals=c.grades[s.id]||{};
        let weighted=c.components.reduce((a,x)=>a+(Number(vals[x.id])||0)*Number(x.weight||0)/100,0);
        return `<tr><td>${esc(s.name)}</td>${c.components.map(x=>`<td><input class="grade" value="${esc(vals[x.id]??"")}" onchange="window.setGrade('${c.id}','${s.id}','${x.id}',this.value)"></td>`).join("")}<td>${weighted.toFixed(1)}</td></tr>`;
      }).join("")}
    </table>
  </section>`;
}

function reports(){
  let sid=window.reportStudent||data.students[0]?.id;
  let s=data.students.find(x=>x.id===sid);
  let ev=data.events.filter(e=>e.studentId===sid);
  let notes=data.notes.filter(n=>n.studentId===sid);
  let options=data.students.map(st=>`<option value="${st.id}" ${st.id===sid?"selected":""}>${esc(st.name)}</option>`).join("");
  return `<header><h2>Reports</h2></header>
  <section class="card"><select onchange="window.reportStudent=this.value;render()">${options}</select>
    <h3>${esc(s?.name||"")}</h3><p><b>Total events:</b> ${ev.length}</p>
    <div class="reportgrid">${data.buttons.filter(b=>b.type==="event").map(b=>`<div class="stat">${b.icon}<b>${ev.filter(e=>e.buttonId===b.id).length}</b><span>${esc(b.label)}</span></div>`).join("")}</div>
    <h4>Out of Class</h4>${ev.filter(e=>e.type==="timed").map(e=>`<p>${e.icon} ${esc(e.label)} — ${new Date(e.start).toLocaleString()} ${e.end?"to "+new Date(e.end).toLocaleString():"(still open)"}</p>`).join("")||"<p>None recorded.</p>"}
    <h4>Notes</h4>${notes.map(n=>`<p>📝 ${esc(n.text)} <span class="small">${new Date(n.created).toLocaleString()}</span></p>`).join("")||"<p>None recorded.</p>"}
  </section>`;
}

function settings(){
  const userLabel=currentUser?.displayName||currentUser?.email||"Google user";
  return `<header><h2>Settings</h2></header>
  <section class="card"><h3>Account</h3>
    <p><b>👤 ${esc(userLabel)}</b></p>
    <p class="small">Your dashboard is stored under your signed-in Google account.</p>
    <button onclick="window.signOut()">Sign out</button>
  </section>
  <section class="card"><h3>Data Storage</h3>
    <p><b>☁️ ${esc(cloudStatus)}</b></p>
    <p class="small">This version saves the dashboard in Cloud Firestore under your authenticated account while keeping a local backup in this browser.</p>
  </section>
  <section class="card"><h3>Keystone Tracking</h3>
    <label>Total school days<br><input type="number" value="${data.totalSchoolDays}" onchange="window.setTotalDays(this.value)"></label>
  </section>
  <section class="card"><h3>Local Data Backup</h3>
    <p class="small">Download a backup before major updates. You can also import it later.</p>
    <button onclick="window.exportData()">⬇ Export Backup</button>
    <label><button type="button" onclick="document.getElementById('importFile').click()">⬆ Import Backup</button>
    <input id="importFile" type="file" accept=".json" style="display:none" onchange="window.importData(this)"></label>
  </section>
  <section class="card"><button onclick="window.resetData()">Reset local demo data</button></section>`;
}

function modalHTML(){
  return `<div class="modalbg"><div class="modal">
    <h3>📝 Note for ${esc(selected.student.name)}</h3>
    <textarea id="noteText" placeholder="Optional context or general note..."></textarea>
    <div><button class="primary" onclick="window.saveNote()">Save Note</button><button onclick="window.closeNote()">Cancel</button></div>
  </div></div>`;
}

function bind(){
  document.querySelectorAll("[data-timer]").forEach(el=>{
    let tick=()=>{
      let sec=Math.floor((Date.now()-new Date(el.dataset.timer))/1000);
      el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
    };
    tick();
    setInterval(tick,1000);
  });
}

/* =========================
   DATA ACTIONS
   ========================= */
window.record=(sid,bid)=>{
  let s=data.students.find(x=>x.id===sid);
  let b=data.buttons.find(x=>x.id===bid);
  if(!s||!b)return;
  let e={id:uid(),studentId:sid,classId:currentClass().id,buttonId:bid,label:b.label,icon:b.icon,type:b.type,start:new Date().toISOString(),end:null};
  data.events.push(e);
  save();
  toast=`${b.icon} ${b.label} recorded for ${s.name}.`;
  if(b.type==="event")selected={student:s,eventId:e.id};
  render();
};

window.returnEvent=(id,status)=>{
  let e=data.events.find(x=>x.id===id);
  if(!e)return;
  e.end=new Date().toISOString();e.status=status;
  save();render();
};

window.note=(sid,eid)=>{
  let student=data.students.find(x=>x.id===sid);
  if(student){selected={student,eventId:eid};render();}
};
window.closeNote=()=>{selected=null;render();};

window.saveNote=()=>{
  let text=$("#noteText")?.value.trim();
  if(text && selected)data.notes.push({id:uid(),studentId:selected.student.id,eventId:selected.eventId,text,created:new Date().toISOString()});
  save();selected=null;render();
};

window.addStudent=()=>{
  let name=$("#newStudent")?.value.trim();
  if(name){data.students.push({id:uid(),name});save();render();}
};

window.addClass=()=>{
  let name=$("#newClass")?.value.trim();
  if(name){data.classes.push({id:uid(),name,studentIds:[]});save();render();}
};

window.roster=(cid,sid,on)=>{
  let c=data.classes.find(x=>x.id===cid);
  if(!c)return;
  c.studentIds=on?[...new Set([...c.studentIds,sid])]:c.studentIds.filter(x=>x!==sid);
  save();
};

window.addSchoolDay=()=>{
  let date=$("#schoolDate")?.value,day=Number($("#schoolDay")?.value);
  if(date&&day){data.schoolDays.push({date,day});save();render();}
};

window.addButton=()=>{
  let label=$("#qbLabel")?.value.trim();
  if(label){
    data.buttons.push({id:uid(),icon:$("#qbIcon")?.value||"⚡",label,type:$("#qbType")?.value||"event"});
    save();render();
  }
};

window.deleteButton=id=>{
  data.buttons=data.buttons.filter(x=>x.id!==id);
  save();render();
};

window.addCourse=()=>{
  let name=$("#courseName")?.value.trim();
  if(name){data.gradeCourses.push({id:uid(),name,components:[],grades:{}});save();render();}
};

window.addComponent=cid=>{
  let name=$(`#comp-${cid}`)?.value.trim(),weight=Number($(`#weight-${cid}`)?.value);
  if(name&&weight){
    let c=data.gradeCourses.find(x=>x.id===cid);
    if(c){c.components.push({id:uid(),name,weight});save();render();}
  }
};

window.setGrade=(cid,sid,coid,val)=>{
  let c=data.gradeCourses.find(x=>x.id===cid);
  if(!c)return;
  c.grades[sid]??={};c.grades[sid][coid]=val;
  save();
};

window.setTotalDays=v=>{data.totalSchoolDays=Number(v);save();};

window.exportData=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`teacher-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(url);
};

window.importData=input=>{
  const file=input.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const incoming=JSON.parse(e.target.result);
      if(!confirm("Import this backup and replace the current dashboard data?"))return;
      data={...seed,...incoming};save();toast="Backup imported successfully.";render();
    }catch{alert("That file does not appear to be a valid Teacher Dashboard backup.");}
  };
  reader.readAsText(file);
};

window.resetData=()=>{
  if(confirm("Reset all dashboard data to the demo data?")){
    data=structuredClone(seed);save();render();
  }
};

$("#root").innerHTML=`<div class="loadingScreen">Loading Teacher Dashboard...</div>`;
</script>
</body>
</html>
