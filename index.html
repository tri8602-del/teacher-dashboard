async function loadCloudData(){

    // is preserved and migrated to the new format instead of being overwritten.
    const cloudDashboard=(snap.exists()&&snap.data()?.dataJson)?parseCloudDashboard(snap.data()):null;

async function syncCloud(){
  if(!currentUser||cloudWriteInProgress)return;
  cloudSavePending=true;
  if(cloudWriteInProgress)return;
  cloudWriteInProgress=true;
  try{
    while(cloudSavePending){
      cloudSavePending=false;
      cloudStatus="Saving to Firebase...";
      render();
      const record=cloudRecord();
      await setDoc(dashboardRef(),record,{merge:true});
      lastSyncAt=record.updatedAt;

    }
  }catch(err){

}

function splitStudentName(name){

}
function studentFirstName(s){
  if((s.firstName||"").trim())return s.firstName.trim();

function normalizeStudents(){
  data.students??=[];
  data.students.forEach(s=>{
    // Repair the accidental V1.6.16 migration that duplicated first names.
    let first=(s.firstName||"").trim();
    let last=(s.lastName||"").trim();
    const current=(s.name||"").trim();

    if(!first && !last){
      const split=splitStudentName(current);
      first=split.firstName; last=split.lastName;
    }else{
      if(!first) first=splitStudentName(current).firstName;
      if(!last) last=splitStudentName(current).lastName;

      // Example bad V1.6.16 data: firstName="Abrianna", lastName="Abrianna DeBolt"
      if(first && last && last.toLowerCase().startsWith(first.toLowerCase()+" ")){
        last=last.slice(first.length).trim();
      }
      // Example bad display name: "Abrianna Abrianna DeBolt"
      const doubledPrefix=(first+" "+first+" ").toLowerCase();
      if(first && current.toLowerCase().startsWith(doubledPrefix) && !last){
        last=current.slice((first+" "+first+" ").length).trim();
      }
    }

    s.firstName=first;
    s.lastName=last;
    s.name=[first,last].filter(Boolean).join(" ") || current || "Unnamed Student";
  });
}
function sortedStudents(list=data.students){

function isoAddDays(date,n){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function isWeekday(date){const d=new Date(date+"T12:00:00").getDay();return d!==0&&d!==6}
function baseDateType(date){
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  return within&&isWeekday(date)?"instructional":"outside";
}
function getDateInfo(date){
  const o=(data.calendarOverrides||{})[date]||{};
  const type=o.type||baseDateType(date);
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  const counted=within&&isWeekday(date)&&(type==="instructional"||type==="inservice");
  const markers={
    nineWeeks:!!o.nineWeeks,endNineWeeks:!!o.endNineWeeks,
    trimester:!!o.trimester,endTrimester:!!o.endTrimester,
    semester:!!o.semester,endSemester:!!o.endSemester
  };
  let schedule=o.schedule!==undefined?o.schedule:(type==="instructional"?"regular":"");
  if(schedule==="alternate")schedule="regular";
  ensureBellSchedules();
  if(schedule&&!data.bellSchedules.some(s=>s.id===schedule))schedule="regular";
  return {type,counted,markers,schedule,countedDay:counted?countedDaysBefore(date):0};
}
function countedDaysBefore(date){
  const s=data.calendarSettings||{};
  if(!s.firstStudentDay||!s.lastStudentDay||date<s.firstStudentDay)return 0;
  const end=date>s.lastStudentDay?s.lastStudentDay:date;
  let count=0,d=s.firstStudentDay;
  while(d<=end){
    const o=(data.calendarOverrides||{})[d]||{};
    const type=o.type||baseDateType(d);
    if(isWeekday(d)&&(type==="instructional"||type==="inservice"))count++;
    d=isoAddDays(d,1);
  }
  return count;
}
function countedDaysTotal(){
  const s=data.calendarSettings||{};
  return s.firstStudentDay&&s.lastStudentDay?countedDaysBefore(s.lastStudentDay):0;
}



function calendarColors(){
  const defaults={
    instructional:"#4f9d69",inservice:"#8b6bb8",noschool:"#cf5f5f",
    nineWeeks:"#d59627",endNineWeeks:"#c77b20",
    trimester:"#3f7fc0",endTrimester:"#2f679e",
    semester:"#6c63a8",endSemester:"#514a8a",
    alternateSchedule:"#b05c8a",note:"#556070"
  };
  return {...defaults,...(data.calendarColors||{})};
}
function eventColor(date,key){
  return ((data.calendarOverrides||{})[date]?.colors||{})[key] || calendarColors()[key];
}
function hexToRgba(hex,alpha=.11){
  const h=String(hex||"").replace("#","").trim();
  if(!/^[0-9a-fA-F]{6}$/.test(h))return `rgba(255,255,255,${alpha})`;
  const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}
function calendarAppearance(date,info){
  // Alternate schedules get visual priority because they are the exception
  // that changes how an otherwise instructional day runs.
  let key="";
  if(info.schedule&&info.schedule!=="regular") key="alternateSchedule";
  else if(["instructional","inservice","noschool"].includes(info.type)) key=info.type;
  if(!key)return {color:"#e0e4ec",background:"#f7f8fa"};
  const color=eventColor(date,key);
  return {color,background:hexToRgba(color,.11)};
}

function upcomingCalendarEvents(limit=8){

    [["endNineWeeks","End of Nine Weeks","endNineWeeks"],["nineWeeks","Beginning of Nine Weeks","nineWeeks"],["endTrimester","End of Trimester","endTrimester"],["trimester","Beginning of Trimester","trimester"],["endSemester","End of Semester","endSemester"],["semester","Beginning of Semester","semester"]].forEach(([key,label,colorKey])=>{if(o[key])events.push({date,label,kind:"Academic Marker",color:eventColor(date,colorKey)})});

  const comps=qs.map(q=>({id:q,label:q.toUpperCase(),kind:"quarter"}));

  if(c.giveFinal)comps.push({id:"final",label:"Final",kind:"exam"});
  return comps;
}
function baseWeights(c){
  const comps=gradeComponents(c),qs=comps.filter(x=>x.kind==="quarter"),ex=comps.filter(x=>x.kind==="exam");
  const w={};
  if(ex.length===2){qs.forEach(x=>w[x.id]=1);ex.forEach(x=>w[x.id]=.5)}
  else if(ex.length===1){[...qs,...ex].forEach(x=>w[x.id]=1)}
  else qs.forEach(x=>w[x.id]=1);
  return w;
}
function currentAverage(c,sid){
  const grades=c.grades?.[sid]||{},w=baseWeights(c);
  const entered=Object.keys(w).filter(id=>grades[id]!==""&&grades[id]!==undefined&&grades[id]!==null&&!Number.isNaN(Number(grades[id])));
  if(!entered.length)return "";
  const totalW=entered.reduce((s,id)=>s+w[id],0);
  return entered.reduce((s,id)=>s+Number(grades[id])*w[id],0)/totalW;
}
function recommendationFor(c,avg){
  if(avg===""||avg===null||!c.usesRecommendations)return "";
  for(const r of c.recommendationRules||[]){
    const op=r.op||"lte",a=Number(r.a),b=Number(r.b);
    if((op==="lte"&&avg<=a)||(op==="gte"&&avg>=a)||(op==="between"&&avg>=Math.min(a,b)&&avg<=Math.max(a,b)))return r.title||"";
  }
  return "";
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function canJoinGroup(id,group){return !group.some(other=>isRestrictedPair(id,other))}
window.generateGroups=()=>{
  ensureClassroomTools();const size=Math.max(2,Math.floor(Number($("#groupSize")?.value)||3));const ids=shuffle(currentToolRoster().map(s=>s.id));
  if(!ids.length){alert("There are no students available.");return;}
  const groups=[];const difficult=[];
  for(const id of ids){
    let candidates=groups.filter(g=>g.length<size&&canJoinGroup(id,g));
    candidates.sort((a,b)=>a.length-b.length);
    if(candidates.length)candidates[0].push(id);else difficult.push(id);
  }
  for(const id of difficult){
    let candidates=groups.filter(g=>canJoinGroup(id,g));candidates.sort((a,b)=>a.length-b.length);
    if(candidates.length&&candidates[0].length<size+1)candidates[0].push(id);else groups.push([id]);
  }
  data.classroomTools.groups=groups;save();render();
}

window.saveClass=oldId=>{

  const rules=ruleEls.map((el,i)=>({id:el.dataset.ruleId||uid(),periods:[...el.querySelectorAll(`input[name^="rule-period-"]:checked`)].map(x=>Number(x.value)),days:[...el.querySelectorAll(`input[name^="rule-day-"]:checked`)].map(x=>Number(x.value))}));
  if(rules.some(r=>!r.days.length)){alert("Each scheduling rule needs at least one meeting day.");return;}
  const selectedTerm=$("#classTerm")?.value||"fullYear";const terms=[selectedTerm];
  if(rules.every(r=>!r.periods.length)&&!confirm("No periods are selected, so this class will not automatically appear on the Live Class page. Save anyway?"))return;
  const old=data.classes.find(c=>c.id===oldId);
  const studentIds=[...document.querySelectorAll('input[name="classStudent"]:checked')].map(x=>x.value);
  const previous=old||{};
  const item={id:oldId||uid(),name,studentIds,rules,periods:[...new Set(rules.flatMap(r=>r.periods))],days:[...new Set(rules.flatMap(r=>r.days))],terms,
  graded:!!$("#classGraded")?.checked,giveMidterm:!!$("#classMidterm")?.checked,giveFinal:!!$("#classFinal")?.checked,
  usesRecommendations:!!$("#classRecommendations")?.checked,recommendationRules:previous.recommendationRules||[],grades:previous.grades||{}};
  if(oldId){const i=data.classes.findIndex(c=>c.id===oldId);if(i>=0)data.classes[i]=item;}else data.classes.push(item);
  save();window.closeClassModal();render();
}

window.setGradeView=mode=>{window.gradeViewMode=mode;render();}
window.selectGradeStudent=id=>{window.gradeStudentId=id;render();}
window.setCourseGrade=(cid,sid,key,val,live=false)=>{
 const c=data.classes.find(x=>x.id===cid);if(!c)return;c.grades??={};c.grades[sid]??={};c.grades[sid][key]=val===""?"":Number(val);save();
 const row=document.querySelector(`input[oninput*="'${cid}','${sid}'"]`)?.closest("tr");
 if(row){const avg=currentAverage(c,sid);const a=row.querySelector(".currentAvg");if(a)a.innerHTML=`<b>${avg===""?"—":avg.toFixed(2)+"%"}</b>`;const r=row.querySelector(".recommendationCell");if(r)r.textContent=recommendationFor(c,avg)||"—";}
}
window.openGradeSettings=id=>{
  const c=data.classes.find(x=>x.id===id);if(!c)return;
  document.querySelector("#gradeSettingsModal")?.remove();
  const rules=(c.recommendationRules||[]).map((r,i)=>recommendationRuleEditor(r,i)).join("");
  document.body.insertAdjacentHTML("beforeend",`<div id="gradeSettingsModal" class="modalbg"><div class="modal classEditor"><h3>⚙ ${esc(c.name)} Grade Settings</h3>
  <details class="collapsibleFieldset" open><summary>Grading Options</summary><div class="collapsibleInner">
  <label><input id="gsGraded" type="checkbox" ${c.graded?"checked":""}> This is a graded course</label><br>
  <label><input id="gsMidterm" type="checkbox" ${c.giveMidterm?"checked":""}> Give Midterm</label><br>
  <label><input id="gsFinal" type="checkbox" ${c.giveFinal?"checked":""}> Give Final</label><br>
  <label><input id="gsRecommendations" type="checkbox" ${c.usesRecommendations?"checked":""}> Uses Recommendations</label>
  </div></details>
  <details class="collapsibleFieldset"><summary>🎓 Recommendation Rules</summary><div class="collapsibleInner"><p class="small">Rules are evaluated from top to bottom. The first matching rule wins.</p>
  <div id="recommendationRules">${rules}</div><button type="button" onclick="window.addRecommendationRule()">＋ Add Rule</button></div></details>
  <div style="margin-top:16px"><button class="primary" onclick="window.saveGradeSettings('${c.id}')">Save Settings</button> <button onclick="window.closeGradeSettings()">Cancel</button></div></div></div>`);
}
function recommendationRuleEditor(r={},i=0){return `<div class="card recommendationRule" style="padding:10px;margin:8px 0"><select class="rrOp" onchange="window.toggleRecommendationBetween(this)"><option value="lte" ${(r.op||"lte")==="lte"?"selected":""}>Less than or equal to</option><option value="between" ${r.op==="between"?"selected":""}>Between</option><option value="gte" ${r.op==="gte"?"selected":""}>Greater than or equal to</option></select>
<input class="rrA" type="number" min="0" max="100" step="0.01" value="${esc(r.a??"")}" placeholder="%">
<span class="rrBetween" style="display:${r.op==="between"?"inline":"none"}"> and <input class="rrB" type="number" min="0" max="100" step="0.01" value="${esc(r.b??"")}" placeholder="%"></span>
→ <input class="rrTitle" value="${esc(r.title||"")}" placeholder="Recommended course title">
<button type="button" onclick="this.closest('.recommendationRule').remove()">Delete</button></div>`}
window.toggleRecommendationBetween=sel=>{const box=sel.closest(".recommendationRule").querySelector(".rrBetween");box.style.display=sel.value==="between"?"inline":"none";}
window.addRecommendationRule=()=>$("#recommendationRules").insertAdjacentHTML("beforeend",recommendationRuleEditor({},0));
window.closeGradeSettings=()=>document.querySelector("#gradeSettingsModal")?.remove();
window.saveGradeSettings=id=>{
 const c=data.classes.find(x=>x.id===id);if(!c)return;
 c.graded=!!$("#gsGraded")?.checked;c.giveMidterm=!!$("#gsMidterm")?.checked;c.giveFinal=!!$("#gsFinal")?.checked;c.usesRecommendations=!!$("#gsRecommendations")?.checked;
 c.recommendationRules=[...document.querySelectorAll(".recommendationRule")].map(el=>({op:el.querySelector(".rrOp").value,a:el.querySelector(".rrA").value,b:el.querySelector(".rrB")?.value||"",title:el.querySelector(".rrTitle").value.trim()})).filter(r=>r.title&&r.a!=="");
 save();window.closeGradeSettings();render();
}
window.setTotalDays=v=>{data.totalSchoolDays=Number(v);save()}
window.uploadAvatar=input=>{
  const file=input.files?.[0];if(!file)return;
  if(file.size>500000){alert("Please choose an image smaller than 500 KB so your dashboard stays lightweight.");input.value="";return}
  const reader=new FileReader();
  reader.onload=e=>{data.profileAvatar=e.target.result;save();render()};
  reader.readAsDataURL(file);
}
window.useGooglePhoto=()=>{data.profileAvatar="";save();render()}
window.exportData=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`teacher-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
}
window.importData=input=>{
  const file=input.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const incoming=JSON.parse(e.target.result);if(!confirm("Import this backup and replace the current dashboard data?"))return;data={...seed,...incoming};save();toast="Backup imported successfully.";render()}catch{alert("That file does not appear to be a valid Teacher Dashboard backup.")}};
  reader.readAsText(file);
}
window.resetData=()=>{if(confirm("Reset all dashboard data to the demo data?")){data=structuredClone(seed);save();render()}}

$("#root").innerHTML=`<div class="loadingScreen">Loading Teacher Dashboard...</div>`;
</script>
</body>
</html>
