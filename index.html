<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Dashboard</title>
<style>
*{box-sizing:border-box}
:root{--nav:#263454;--nav2:#3d4d73;--bg:#f4f6fb;--text:#202532;--muted:#697386;--line:#dce1eb}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{padding:8px 12px;border:1px solid #cbd2df;border-radius:8px;background:#fff;cursor:pointer}
button:hover{background:#eef2fa}
button.primary{background:var(--nav);color:#fff;border-color:var(--nav)}
button.primary:hover{background:#1e2944}
input,select,textarea{padding:9px;border:1px solid #ccd3df;border-radius:7px}
textarea{width:100%;min-height:120px}
.app{display:flex;min-height:100vh}
aside{width:235px;background:var(--nav);color:#fff;padding:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:flex-start;gap:8px;font-size:22px;margin:0 0 22px}.brandEmoji{font-size:25px;line-height:1.1}
.nav{width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#e3e8f6;text-align:left;font-size:14px;margin:2px 0}
.nav:hover,.nav.active{background:var(--nav2)}
.status{position:absolute;bottom:94px;font-size:12px;color:#cbd4e9;max-width:195px}
.userCard{position:absolute;left:18px;right:18px;bottom:18px;padding-top:14px;border-top:1px solid #44557c;font-size:12px}
.userCard .userName{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:6px 0;color:#fff}
.sidebarUser{display:flex;align-items:center;gap:9px}.sidebarAvatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff2;border:1px solid #ffffff44}
main{flex:1;padding:26px;max-width:1500px;margin:0 auto;width:100%;align-self:flex-start}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
h2,h3,h4{margin-top:0} header p{margin:4px 0;color:var(--muted)}
.card,.student,.alert{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0000000c}
.card{margin-bottom:14px}.alert{border-left:4px solid #dba83d;margin-bottom:16px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.student h3{margin:0 0 12px}.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{padding:8px;border:1px solid #dce1eb;background:#fafbfe}.quick span{font-size:11px;margin-left:3px}
.noteBtn{margin-top:10px;background:transparent;border:0;color:#425796}.out{background:#fff5d8;padding:10px;border-radius:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.add{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e7eaf0;text-align:left}
.grade{width:70px}.small{font-size:12px;color:var(--muted)}
.toast{position:fixed;right:20px;top:18px;background:var(--nav);color:#fff;padding:12px;border-radius:8px;z-index:40}.toast button{margin-left:8px;padding:1px 6px}
.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:18px}
.reportgrid{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f1f4fa;border-radius:9px;padding:12px;min-width:100px;display:flex;flex-direction:column}.stat b{font-size:24px}
.calendarSettings{display:flex;gap:18px;align-items:end;flex-wrap:wrap}.calendarSettings label{font-weight:600}
.calendarCount{margin-left:auto;background:#f1f4fa;padding:10px 18px;border-radius:9px;display:flex;flex-direction:column;text-align:center}.calendarCount b{font-size:24px}
.upcomingDates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}.upcomingCard{border:1px solid #e0e4ec;border-left:4px solid var(--event-color,#8b6bb8);border-radius:10px;padding:11px;background:#fff}.upcomingCard b{display:block;font-size:13px}.upcomingCard span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.markerPill{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:999px;background:#fff9;border:1px solid #00000012;font-size:10px;font-weight:800;line-height:1.15}.noteSnippet{font-size:10px;margin-top:4px;color:#556070;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}.markerCard{font-size:10px;font-weight:800;margin-right:3px;padding:2px 4px;border-radius:5px;background:#fff;border:1px solid currentColor;display:inline-block;line-height:1.1}
.calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calHead h3{margin:0}
.weekdays,.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays span{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:5px}
.calBlank{min-height:82px}.calDay{min-height:82px;text-align:left;padding:7px;display:flex;flex-direction:column;align-items:flex-start;border:1px solid #e0e4ec;border-left:4px solid var(--cal-color,#e0e4ec);background:var(--cal-bg,#fff)}
.calDay.outside{background:#f7f8fa;color:#a1a8b5;border-left-color:#e0e4ec}.calDay.today{outline:2px solid var(--nav)}
.dayNum{font-size:10px;color:var(--muted);margin-top:2px}.calMarks{font-size:14px;margin-top:auto;line-height:1.3}.calMark{font-weight:800;margin-right:3px}.calNote{font-size:11px;margin-top:3px;color:#556070}.colorGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.colorGrid label{font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}.colorGrid input[type=color]{width:46px;height:32px;padding:2px}.todayNotes{border-left:4px solid #4c79c6}.todayNotes h3{margin-bottom:8px}.todayNotes ul{margin:8px 0 0;padding-left:22px}.todayNotes li{margin:6px 0}
.altScheduleTag,.calendarTypeTag{font-size:10px;font-weight:700;margin-top:auto;padding:2px 6px;border-radius:999px;background:#fff9;border:1px solid #00000012;color:inherit;max-width:100%;white-space:normal;line-height:1.15}.calendarTypeTag{margin-top:4px}.bellScheduleList{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}.bellScheduleCard{border:1px solid #e0e4ec;border-radius:12px;padding:12px;background:#fff}.bellScheduleCard h4{margin:0 0 5px}.bellScheduleCard p{margin:0 0 10px}.scheduleTable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.scheduleTable th,.scheduleTable td{border-bottom:1px solid #e5e8ee;padding:7px;text-align:left}.scheduleTable input{width:100%;box-sizing:border-box}.scheduleActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.scheduleEditor{max-width:760px}.scheduleRows{max-height:48vh;overflow:auto;border:1px solid #e0e4ec;border-radius:10px;padding:8px}.scheduleRow{display:grid;grid-template-columns:1.8fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}.scheduleRow input{min-width:0}.scheduleRow button{padding:7px 9px}.scheduleMeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.scheduleMeta input{flex:1;min-width:180px}@media(max-width:620px){.scheduleRow{grid-template-columns:1fr 1fr 1fr}.scheduleRow input:first-child{grid-column:1/-1}.scheduleRow button{grid-column:3}}.calEventTag{font-size:10px;font-weight:700;margin-top:4px;line-height:1.2}
.appFooter{margin-top:32px;padding:14px 0 4px;text-align:center;color:#98a1b2;font-size:10px}
.viewToggle{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px}.viewToggle button{font-size:13px}.viewToggle .activeView{background:var(--nav);color:#fff;border-color:var(--nav)}
.matrixWrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px #0000000c;overflow:auto;max-height:calc(100vh - 190px)}
.matrix{width:100%;min-width:850px;border-collapse:separate;border-spacing:0;table-layout:fixed}.matrix th{position:sticky;top:0;background:#f5f7fb;z-index:2;font-size:12px;white-space:normal;text-align:center;vertical-align:middle}.matrix th span{font-weight:500;display:inline-block;line-height:1.15}.matrix td{text-align:center;padding:5px;vertical-align:middle}.matrixBtn{width:36px;height:34px;padding:4px;font-size:17px}
.stickyName{position:sticky!important;left:0;background:#fff;z-index:3;text-align:left!important;width:210px;min-width:210px}.matrix th.stickyName{background:#f5f7fb}.studentOut td{background:#fff9e8!important}.studentOut .stickyName{background:#fff9e8!important}
.loginScreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef1f8,#f7f8fc)}
.loginCard{width:min(430px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 12px 35px #26345424;text-align:center}.loginCard h1{color:var(--nav);margin-bottom:8px}.loginCard p{color:#667085;line-height:1.5}
.googleBtn{margin-top:16px;width:100%;padding:12px;font-weight:650;font-size:16px}.loginError{margin-top:14px;color:#a62f2f;font-size:13px}.loadingScreen{min-height:100vh;display:grid;place-items:center;color:#667085}
.accountRow{display:flex;align-items:center;gap:12px;margin:8px 0 14px}.accountAvatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#eef1f8;border:1px solid #dce1eb}.avatarFallback{display:grid;place-items:center;font-size:25px}.avatarActions{display:flex;gap:8px;flex-wrap:wrap}.syncTime{margin-top:6px;font-size:12px;color:#697386}
.classMeta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.classMeta span{font-size:11px;background:#f1f4fa;border:1px solid #e0e4ec;border-radius:999px;padding:3px 7px;color:#556070}.classEditor{max-width:720px}.checkGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin:8px 0}.checkGrid label{font-size:13px;padding:6px 8px;border:1px solid #e0e4ec;border-radius:8px;background:#fafbfe}.sectionLabel{font-weight:800;margin-top:14px;display:block}.classEmpty{padding:18px;text-align:center;color:#697386}.noActiveClass{padding:26px;text-align:center;color:#697386}.classStatus{font-size:12px;color:#697386;margin-top:4px}
@media(max-width:750px){aside{width:62px;padding:8px}aside .brand span:last-child{display:none}.brandEmoji{font-size:22px}.nav{font-size:0;text-align:center}.nav:first-letter{font-size:19px}.status,.userCard{display:none}main{padding:14px}.split{grid-template-columns:1fr}.quick span{display:none}}
@media(max-width:650px){.calDay,.calBlank{min-height:62px}.calDay{padding:4px;font-size:12px}.calMarks{font-size:11px}.weekdays span{font-size:9px}.calendarSettings{align-items:stretch}.calendarCount{margin-left:0}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signInWithRedirect,getRedirectResult,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyAum-USwVh7epu7X7gMuFjlGzszkPKPA7U",
  authDomain:"teacher-dashboard-b4441.firebaseapp.com",
  projectId:"teacher-dashboard-b4441",
  storageBucket:"teacher-dashboard-b4441.firebasestorage.app",
  messagingSenderId:"191461146682",
  appId:"1:191461146682:web:c30279a76a586db32af503"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);
const APP_VERSION="1.6.5";
const LOCAL_PREFIX="teacherDashboardV1:user:";
const CLOUD_SUBCOLLECTION="dashboards";
const CLOUD_DOCUMENT="main";

const defaultButtons=[
 ["tardy","⏰","Tardy","event"],["phone","📱","Phone","event"],
 ["talking","🗣️","Excessive Talking","event"],["outseat","🚶","Out of Seat","event"],
 ["sleeping","😴","Sleeping","event"],["refusal","🚫","Not Working","event"],
 ["restroom","🚻","Restroom","timed"]
];

const seed={
 classes:[{id:"c1",name:"Honors Precalculus",studentIds:["s1","s2","s3"],periods:[1],days:[1,2,3,4,5],terms:["fullYear"]}],
 students:[{id:"s1",name:"Abby Smith"},{id:"s2",name:"Ben Jones"},{id:"s3",name:"Chris Brown"}],
 buttons:defaultButtons.map(([id,icon,label,type])=>({id,icon,label,type})),
 events:[],notes:[],schoolDays:[],totalSchoolDays:178,gradeCourses:[],
 profileAvatar:"",
 calendarSettings:{firstStudentDay:"",lastStudentDay:""},
 calendarOverrides:{},
 calendarColors:{instructional:"#4f9d69",inservice:"#8b6bb8",noschool:"#cf5f5f",nineWeeks:"#d59627",endNineWeeks:"#c77b20",trimester:"#3f7fc0",endTrimester:"#2f679e",semester:"#6c63a8",endSemester:"#514a8a",alternateSchedule:"#b05c8a",note:"#556070"},
 calendarViewDate:new Date().toISOString().slice(0,7),
 bellSchedules:[
  {id:"regular",name:"Regular Bell Schedule",kind:"regular",periods:[
   ["Breakfast","7:45","8:00"],["1st Period","8:00","8:40"],["2nd Period","8:43","9:23"],["3rd Period","9:26","10:06"],["4th Period","10:09","10:49"],["5th Period (HS Lunch)","10:52","11:32"],["6th Period (MS Lunch / PLT)","11:35","12:15"],["7th Period","12:18","12:58"],["8th Period","1:01","1:41"],["9th Period","1:44","2:24"],["Flex","2:27","2:47"]]},
  {id:"delay2",name:"2 Hour Delay",kind:"alternate",periods:[
   ["Breakfast","9:45","10:00"],["1st Period","10:00","10:29"],["2nd Period","10:32","11:01"],["3rd Period","11:04","11:33"],["4th Period","11:36","12:05"],["5th Period (HS Lunch)","12:08","12:38"],["6th Period (MS Lunch / PLT)","12:41","1:11"],["7th Period","1:14","1:43"],["8th Period","1:46","2:15"],["9th Period","2:18","2:47"],["Flex","2:47","3:15"]]},
  {id:"early2",name:"2 Hour Early Dismissal",kind:"alternate",periods:[
   ["Breakfast","7:45","8:00"],["1st Period","8:00","8:36"],["2nd Period","8:39","9:15"],["3rd Period","9:18","9:54"],["4th Period","9:57","10:33"],["5th Period (HS Lunch)","10:36","11:12"],["6th Period (MS Lunch / PLT)","11:15","11:51"],["7th Period","11:54","12:30"]]},
  {id:"early3",name:"3 Hour Early Dismissal",kind:"alternate",periods:[
   ["Breakfast","7:45","8:00"],["1st Period","8:00","8:30"],["2nd Period","8:33","9:03"],["3rd Period","9:06","9:36"],["4th Period","9:39","10:09"],["5th Period (HS Lunch)","10:12","10:52"],["6th Period (MS Lunch / PLT)","10:55","11:35"]]},
  {id:"peprally",name:"Pep Rally",kind:"alternate",periods:[
   ["Breakfast","7:45","8:00"],["1st Period","8:00","8:37"],["2nd Period","8:40","9:17"],["3rd Period","9:20","9:57"],["4th Period","10:00","10:37"],["5th Period (HS Lunch)","10:40","11:17"],["6th Period (MS Lunch / PLT)","11:20","11:57"],["7th Period","12:00","12:37"],["8th Period","12:40","1:17"],["9th Period","1:20","1:57"],["Pep Rally","2:00","2:47"]]}
 ]
};

let data=structuredClone(seed);
let page="live",selected=null;
let liveView=localStorage.teacherDashboardLiveView||"cards";
let currentUser=null,cloudStatus="Waiting for sign-in",lastSyncAt=null;
let cloudSaveTimer=null,cloudWriteInProgress=false,cloudSavePending=false;
let authBusy=false,loginError="",initializedUserData=false,toast="";

function localKey(){return currentUser?LOCAL_PREFIX+currentUser.uid:null}
function defaultBellSchedules(){
  return structuredClone(seed.bellSchedules||[]);
}
function ensureBellSchedules(){
  if(!Array.isArray(data.bellSchedules)||!data.bellSchedules.length)data.bellSchedules=defaultBellSchedules();
  if(!data.bellSchedules.some(s=>s.id==="regular")){
    data.bellSchedules.unshift(defaultBellSchedules().find(s=>s.id==="regular"));
  }
}
function ensureClassFields(){
  if(!Array.isArray(data.classes))data.classes=[];
  data.classes.forEach(c=>{
    c.studentIds=Array.isArray(c.studentIds)?c.studentIds:[];
    c.periods=Array.isArray(c.periods)?c.periods:[];
    c.days=Array.isArray(c.days)&&c.days.length?c.days:[1,2,3,4,5];
    c.rules=Array.isArray(c.rules)&&c.rules.length?c.rules:[{id:"legacy",periods:[...c.periods],days:[...c.days]}];
    c.rules=c.rules.map((r,i)=>({id:r.id||`rule-${i}`,periods:Array.isArray(r.periods)?r.periods.map(Number):[],days:Array.isArray(r.days)&&r.days.length?r.days.map(Number):[1,2,3,4,5]}));
    c.terms=Array.isArray(c.terms)&&c.terms.length?c.terms:["fullYear"];
  });
}
function bellScheduleById(id){
  ensureBellSchedules();
  return data.bellSchedules.find(s=>s.id===id)||data.bellSchedules.find(s=>s.id==="regular");
}
function bellScheduleName(id){
  const s=bellScheduleById(id);
  return s?.name||"Regular Bell Schedule";
}
function bellScheduleOptions(selectedId){
  ensureBellSchedules();
  const none=`<option value="" ${!selectedId?"selected":""}>No Bell Schedule</option>`;
  return none+data.bellSchedules.map(s=>`<option value="${esc(s.id)}" ${s.id===selectedId?"selected":""}>${esc(s.name)}${s.id==="regular"?" (Default)":""}</option>`).join("");
}
function loadLocalForUser(){
  const key=localKey();
  if(!key)return structuredClone(seed);
  try{const loaded={...seed,...JSON.parse(localStorage.getItem(key)||"{}")}; if(!Array.isArray(loaded.bellSchedules)||!loaded.bellSchedules.length)loaded.bellSchedules=defaultBellSchedules(); if(!Array.isArray(loaded.classes))loaded.classes=[]; return loaded}catch{return structuredClone(seed)}
}
function saveLocal(){const key=localKey();if(key)localStorage.setItem(key,JSON.stringify(data))}
function dashboardRef(){return currentUser?doc(db,"users",currentUser.uid,CLOUD_SUBCOLLECTION,CLOUD_DOCUMENT):null}
function cloudDataPayload(){
  // Firestore rejects `undefined` anywhere inside nested objects. JSON serialization
  // also gives us a clean plain-data snapshot for the cloud document.
  const payload=JSON.parse(JSON.stringify(data));
  delete payload.profileAvatar;
  return payload;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function formatSync(value){
  if(!value)return "Not synced yet";
  const d=new Date(value);
  return isNaN(d)?"Not synced yet":d.toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
}
function avatarSrc(){return data.profileAvatar||currentUser?.photoURL||""}
function avatarHTML(cls="accountAvatar"){
  const src=avatarSrc();
  return src?`<img class="${cls}" src="${esc(src)}" alt="Profile picture">`:`<div class="${cls} avatarFallback">👤</div>`;
}

async function loadCloudData(){
  if(!currentUser)return;
  cloudStatus="Loading your dashboard...";render();
  data=loadLocalForUser();
  try{
    const snap=await getDoc(dashboardRef());
    if(snap.exists()&&snap.data()?.data){
      data={...seed,...snap.data().data,profileAvatar:(loadLocalForUser().profileAvatar||snap.data().data?.profileAvatar||"")}; ensureBellSchedules();
      lastSyncAt=snap.data().updatedAt||null;
      cloudStatus="Firebase synced";
      saveLocal();
    }else{
      cloudStatus="Firebase synced";
      await setDoc(dashboardRef(),{data:cloudDataPayload(),ownerUid:currentUser.uid,updatedAt:new Date().toISOString()},{merge:true});
      lastSyncAt=new Date().toISOString();
    }
  }catch(err){
    console.error(err);
    cloudStatus="Saved locally — cloud sync failed";
  }
  initializedUserData=true;
  render();
}

function save(){
  saveLocal();
  if(!currentUser||!initializedUserData)return;
  cloudSavePending=true;
  cloudStatus="Saving to Firebase...";
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(syncCloud,350);
}
async function syncCloud(){
  if(!currentUser||cloudWriteInProgress)return;
  cloudSavePending=true;
  if(cloudWriteInProgress)return;
  cloudWriteInProgress=true;
  try{
    while(cloudSavePending){
      cloudSavePending=false;
      cloudStatus="Saving to Firebase...";
      render();
      const now=new Date().toISOString();
      await setDoc(dashboardRef(),{data:cloudDataPayload(),ownerUid:currentUser.uid,updatedAt:now},{merge:true});
      lastSyncAt=now;
      cloudStatus="Firebase synced";
    }
  }catch(err){
    console.error("Firebase save failed:",err);
    cloudStatus="Saved locally — cloud sync failed";
  }finally{
    cloudWriteInProgress=false;
    render();
  }
}

window.signIn=async()=>{
  if(authBusy)return;
  authBusy=true;loginError="";render();
  try{await signInWithPopup(auth,provider)}
  catch(err){
    console.error("Google sign-in failed:",err);
    if(err.code==="auth/popup-blocked"||err.code==="auth/cancelled-popup-request"){
      try{await signInWithRedirect(auth,provider);return}
      catch(redirectErr){loginError=redirectErr.message||"Google sign-in could not be started."}
    }else if(err.code!=="auth/popup-closed-by-user"){
      loginError=err.message||"Google sign-in failed.";
    }
  }finally{authBusy=false;render()}
};
window.signOut=async()=>{await signOut(auth)}

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  initializedUserData=false;
  selected=null;
  if(!user){data=structuredClone(seed);cloudStatus="Waiting for sign-in";lastSyncAt=null;render();return}
  await loadCloudData();
});

getRedirectResult(auth).catch(err=>{console.error(err);loginError=err.message||"Google sign-in failed.";render()});

function render(){
  if(!currentUser){$("#root").innerHTML=loginHTML();return}
  const userLabel=currentUser.displayName||currentUser.email||"Google user";
  $("#root").innerHTML=`<div class="app"><aside>
    <h1 class="brand"><span class="brandEmoji">🍎</span><span>Teacher<br>Dashboard</span></h1>
    ${nav()}
    <div class="status">☁️ ${esc(cloudStatus)}</div>

function timeToMinutes(value,previous=-1){
  const m=String(value||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);if(!m)return null;
  let h=Number(m[1]),min=Number(m[2]||0),ampm=(m[3]||"").toLowerCase();
  if(ampm){if(h===12)h=0;if(ampm==="pm")h+=12;}else{let raw=h*60+min;if(previous>=0&&raw+360<previous)raw+=720;return raw;}
  return h*60+min;
}
function currentScheduleBlock(date=new Date()){

}

function isoAddDays(date,n){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function isWeekday(date){const d=new Date(date+"T12:00:00").getDay();return d!==0&&d!==6}
function baseDateType(date){
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  return within&&isWeekday(date)?"instructional":"outside";
}
function getDateInfo(date){
  const o=(data.calendarOverrides||{})[date]||{};
  const type=o.type||baseDateType(date);
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  const counted=within&&isWeekday(date)&&(type==="instructional"||type==="inservice");
  const markers={
    nineWeeks:!!o.nineWeeks,endNineWeeks:!!o.endNineWeeks,
    trimester:!!o.trimester,endTrimester:!!o.endTrimester,
    semester:!!o.semester,endSemester:!!o.endSemester
  };
  let schedule=o.schedule!==undefined?o.schedule:(type==="instructional"?"regular":"");
  if(schedule==="alternate")schedule="regular";
  ensureBellSchedules();
  if(schedule&&!data.bellSchedules.some(s=>s.id===schedule))schedule="regular";
  return {type,counted,markers,schedule,countedDay:counted?countedDaysBefore(date):0};
}
function countedDaysBefore(date){
  const s=data.calendarSettings||{};
  if(!s.firstStudentDay||!s.lastStudentDay||date<s.firstStudentDay)return 0;
  const end=date>s.lastStudentDay?s.lastStudentDay:date;
  let count=0,d=s.firstStudentDay;
  while(d<=end){
    const o=(data.calendarOverrides||{})[d]||{};
    const type=o.type||baseDateType(d);
    if(isWeekday(d)&&(type==="instructional"||type==="inservice"))count++;
    d=isoAddDays(d,1);
  }
  return count;
}
function countedDaysTotal(){
  const s=data.calendarSettings||{};
  return s.firstStudentDay&&s.lastStudentDay?countedDaysBefore(s.lastStudentDay):0;
}

function hexToRgba(hex,alpha=.11){
  const h=String(hex||"").replace("#","").trim();
  if(!/^[0-9a-fA-F]{6}$/.test(h))return `rgba(255,255,255,${alpha})`;
  const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}
function calendarAppearance(date,info){

function upcomingCalendarEvents(limit=8){

    [["endNineWeeks","End of Nine Weeks","endNineWeeks"],["nineWeeks","Beginning of Nine Weeks","nineWeeks"],["endTrimester","End of Trimester","endTrimester"],["trimester","Beginning of Trimester","trimester"],["endSemester","End of Semester","endSemester"],["semester","Beginning of Semester","semester"]].forEach(([key,label,colorKey])=>{if(o[key])events.push({date,label,kind:"Academic Marker",color:eventColor(date,colorKey)})});

  ensureBellSchedules();
  const name=($("#bellName").value||"").trim()||"Custom Bell Schedule";
  const periods=[...document.querySelectorAll("#scheduleRows .scheduleRow")].map(row=>[...row.querySelectorAll("input")].map(i=>i.value.trim())).filter(p=>p.some(Boolean));
  if(!periods.length){alert("Please add at least one period or block.");return;}
  if(oldId){
    const s=data.bellSchedules.find(x=>x.id===oldId);
    if(s){s.name=name;s.periods=periods;}
  }else{
    let id="schedule-"+Date.now().toString(36);
    while(data.bellSchedules.some(s=>s.id===id))id+="x";
    data.bellSchedules.push({id,name,kind:"alternate",periods});
  }
  save();window.closeBellScheduleModal();render();
}
window.deleteBellSchedule=id=>{
  ensureBellSchedules();
  const s=data.bellSchedules.find(x=>x.id===id);
  if(!s||id==="regular")return;
  if(!confirm(`Delete "${s.name}"? Dates using it will return to the Regular Bell Schedule.`))return;
  data.bellSchedules=data.bellSchedules.filter(x=>x.id!==id);
  Object.values(data.calendarOverrides||{}).forEach(o=>{if(o.schedule===id)o.schedule="regular"});
  save();render();
}

window.changeMonth=n=>{
  const [y,m]=(data.calendarViewDate||new Date().toISOString().slice(0,7)).split("-").map(Number);
  data.calendarViewDate=new Date(y,m-1+n,1).toISOString().slice(0,7);
  saveLocal();render();
}
window.setCalendarBoundary=(key,value)=>{
  data.calendarSettings??={firstStudentDay:"",lastStudentDay:""};
  data.calendarSettings[key]=value;
  if(key==="firstStudentDay"&&value)data.calendarViewDate=value.slice(0,7);
  save();render();
}
window.editDate=date=>{window.calendarEditDate=date;renderCalendarModal()}
function renderCalendarModal(){
  document.querySelector("#calModal")?.remove();
  const date=window.calendarEditDate,info=getDateInfo(date),o=(data.calendarOverrides||{})[date]||{},colors=calendarColors();
  const label=new Date(date+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  const options=`<option value="instructional" ${info.type==="instructional"?"selected":""}>Instructional Day</option><option value="inservice" ${info.type==="inservice"?"selected":""}>In-Service Day</option><option value="noschool" ${info.type==="noschool"?"selected":""}>No School / Vacation</option><option value="outside" ${info.type==="outside"?"selected":""}>Outside Student Year</option>`;
  const notes=(o.notes||[]).join("\n");
  const colorRow=(key,label)=>`<label>${label}<br><input id="color-${key}" type="color" value="${eventColor(date,key)}"><select id="scope-${key}"><option value="this">This event only</option><option value="all">All ${label} events</option></select></label>`;
  document.body.insertAdjacentHTML("beforeend",`<div id="calModal" class="modalbg"><div class="modal"><h3>🗓️ ${label}</h3><label>Day Type<br><select id="calType">${options}</select></label><p class="small">Weekdays between the first and last student day automatically count as instructional days unless you change them. In-service days count too.</p><hr><b>Academic Markers</b><p><label><input id="markNine" type="checkbox" ${o.nineWeeks?"checked":""}> Beginning of Nine Weeks</label><br><label><input id="markEndNine" type="checkbox" ${o.endNineWeeks?"checked":""}> End of Nine Weeks</label><br><label><input id="markTri" type="checkbox" ${o.trimester?"checked":""}> Beginning of Trimester</label><br><label><input id="markEndTri" type="checkbox" ${o.endTrimester?"checked":""}> End of Trimester</label><br><label><input id="markSem" type="checkbox" ${o.semester?"checked":""}> Beginning of Semester</label><br><label><input id="markEndSem" type="checkbox" ${o.endSemester?"checked":""}> End of Semester</label></p><hr><b>Calendar Colors</b><p class="small">These colors control the calendar appearance. Day types and alternate schedules use the color for a light background shade and the left stripe. Markers keep their colored symbol.</p><p class="small">For each item, choose whether the color changes only this date or becomes the default for every event of that type.</p><div class="colorGrid">${colorRow("instructional","Instructional")} ${colorRow("inservice","In-Service")} ${colorRow("noschool","No School")} ${colorRow("nineWeeks","Beginning Nine Weeks")} ${colorRow("endNineWeeks","End Nine Weeks")} ${colorRow("trimester","Beginning Trimester")} ${colorRow("endTrimester","End Trimester")} ${colorRow("semester","Beginning Semester")} ${colorRow("endSemester","End Semester")} ${colorRow("alternateSchedule","Alternate Schedule")} ${colorRow("note","Notes")}</div><hr><label>Bell Schedule<br><select id="calSchedule">${bellScheduleOptions(info.schedule)}</select></label><p class="small">Instructional days automatically use the Regular Bell Schedule. Select one of your alternate schedules when this date runs differently.</p><hr><label><b>📝 Notes for this day</b><br><textarea id="calNotes" placeholder="One note per line. These will appear on your dashboard when this date arrives.">${esc(notes)}</textarea></label><p class="small">Notes stay attached to this date in the calendar and automatically appear on the Live Class dashboard on that day.</p><div style="margin-top:16px"><button class="primary" onclick="window.saveDateDetails('${date}')">Save</button> <button onclick="window.closeCalendarModal()">Cancel</button></div></div></div>`);
}
window.closeCalendarModal=()=>document.querySelector("#calModal")?.remove()
window.saveDateDetails=date=>{
  data.calendarOverrides??={};
  const type=$("#calType").value,schedule=$("#calSchedule").value;
  const notes=($("#calNotes").value||"").split("\n").map(x=>x.trim()).filter(Boolean);
  data.calendarColors=calendarColors();
  const keys=["instructional","inservice","noschool","nineWeeks","endNineWeeks","trimester","endTrimester","semester","endSemester","alternateSchedule","note"];
  const existingColors=((data.calendarOverrides[date]||{}).colors||{});
  const localColors={...existingColors};
  keys.forEach(key=>{
    const value=$(`#color-${key}`).value,scope=$(`#scope-${key}`).value;
    if(scope==="all"){data.calendarColors[key]=value;delete localColors[key];}
    else if(value!==calendarColors()[key]) localColors[key]=value;
    else delete localColors[key];
  });
  data.calendarOverrides[date]={
    type,
    nineWeeks:$("#markNine").checked,endNineWeeks:$("#markEndNine").checked,
    trimester:$("#markTri").checked,endTrimester:$("#markEndTri").checked,
    semester:$("#markSem").checked,endSemester:$("#markEndSem").checked,
    notes,colors:localColors
  };
  if(schedule)data.calendarOverrides[date].schedule=schedule;
  save();window.closeCalendarModal();render();
}

function quickButtons(){return `<header><h2>Quick Buttons</h2></header><section class="card"><h3>Current Buttons</h3>${data.buttons.map(b=>`<p>${b.icon} <b>${esc(b.label)}</b> <span class="small">(${esc(b.type)})</span> <button onclick="window.deleteButton('${b.id}')">Delete</button></p>`).join("")}<hr><div class="add"><input id="qbIcon" placeholder="Emoji" value="⚡" style="width:80px"><input id="qbLabel" placeholder="Button label"><select id="qbType"><option value="event">Event</option><option value="timed">Timed / Out of Class</option></select><button class="primary" onclick="window.addButton()">Add button</button></div></section>`}

function grades(){return `<header><h2>Grades</h2></header><section class="card"><div class="add"><input id="courseName" placeholder="Course name"><button class="primary" onclick="window.addCourse()">Add course</button></div></section>${data.gradeCourses.map(c=>`<section class="card"><h3>${esc(c.name)}</h3><div class="add"><input id="comp-${c.id}" placeholder="Component"><input id="weight-${c.id}" type="number" placeholder="Weight %" style="width:120px"><button onclick="window.addComponent('${c.id}')">Add component</button></div>${c.components.length?`<table><thead><tr><th>Student</th>${c.components.map(co=>`<th>${esc(co.name)} (${co.weight}%)</th>`).join("")}</tr></thead><tbody>${data.students.map(s=>`<tr><td>${esc(s.name)}</td>${c.components.map(co=>`<td><input class="grade" value="${esc(c.grades?.[s.id]?.[co.id]??"")}" onchange="window.setGrade('${c.id}','${s.id}','${co.id}',this.value)"></td>`).join("")}</tr>`).join("")}</tbody></table>`:"<p class='small'>Add grading components to begin.</p>"}</section>`).join("")}`}

function reports(){
  const sid=window.reportStudent||data.students[0]?.id,s=data.students.find(x=>x.id===sid),ev=data.events.filter(e=>e.studentId===sid),notes=data.notes.filter(n=>n.studentId===sid);
  const opts=data.students.map(st=>`<option value="${st.id}" ${st.id===sid?"selected":""}>${esc(st.name)}</option>`).join("");
  return `<header><h2>Reports</h2></header><section class="card"><select onchange="window.reportStudent=this.value;render()">${opts}</select><h3 style="margin-top:14px">${esc(s?.name||"")}</h3><p><b>Total events:</b> ${ev.length}</p><div class="reportgrid">${data.buttons.filter(b=>b.type==="event").map(b=>`<div class="stat">${b.icon}<b>${ev.filter(e=>e.buttonId===b.id).length}</b><span>${esc(b.label)}</span></div>`).join("")}</div><h4>Out of Class</h4>${ev.filter(e=>e.type==="timed").map(e=>`<p>${e.icon} ${esc(e.label)} — ${new Date(e.start).toLocaleString()} ${e.end?"to "+new Date(e.end).toLocaleString():"(still open)"}</p>`).join("")||"<p>None recorded.</p>"}<h4>Notes</h4>${notes.map(n=>`<p>📝 ${esc(n.text)} <span class="small">${new Date(n.created).toLocaleString()}</span></p>`).join("")||"<p>None recorded.</p>"}</section>`;
}

function settings(){
  const userLabel=currentUser?.displayName||currentUser?.email||"Google user";
  return `<header><h2>Settings</h2></header>
  <section class="card"><h3>Account</h3><div class="accountRow">${avatarHTML()}<div><b>${esc(userLabel)}</b><div class="small">${esc(currentUser?.email||"")}</div></div></div>
  <div class="avatarActions"><button type="button" onclick="document.getElementById('avatarFile').click()">📷 Upload a picture</button>${data.profileAvatar?`<button type="button" onclick="window.useGooglePhoto()">Use Google picture</button>`:""}</div>
  <input id="avatarFile" type="file" accept="image/*" style="display:none" onchange="window.uploadAvatar(this)"><button style="margin-top:12px" onclick="window.signOut()">Sign out</button></section>
  <section class="card"><h3>Data Storage</h3><p><b>☁️ ${esc(cloudStatus)}</b></p><div class="syncTime"><b>Last sync:</b> ${esc(formatSync(lastSyncAt))}</div><p class="small">Your dashboard is stored separately for each signed-in Google account.</p></section>
  <section class="card"><h3>Keystone Tracking</h3><label>Total counted school days<br><input type="number" value="${data.totalSchoolDays}" onchange="window.setTotalDays(this.value)"></label></section>
  <section class="card"><h3>Local Data Backup</h3><p class="small">Download a backup before major updates. You can also import it later.</p><button onclick="window.exportData()">Download backup</button> <button onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="window.importData(this)"></section>
  <section class="card"><button onclick="window.resetData()">Reset this dashboard to demo data</button></section>`;
}
function modalHTML(){return `<div class="modalbg"><div class="modal"><h3>📝 Note for ${esc(selected.student.name)}</h3><textarea id="noteText" placeholder="Optional context or general note..."></textarea><div><button class="primary" onclick="window.saveNote()">Save Note</button> <button onclick="window.closeNote()">Cancel</button></div></div></div>`}
function bind(){document.querySelectorAll("[data-timer]").forEach(el=>{const tick=()=>{const sec=Math.floor((Date.now()-new Date(el.dataset.timer))/1000);el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`};tick();setInterval(tick,1000);})}

window.setLiveView=v=>{liveView=v;localStorage.teacherDashboardLiveView=v;render()}
window.record=(sid,bid)=>{const s=data.students.find(x=>x.id===sid),b=data.buttons.find(x=>x.id===bid),cls=currentClass();if(!s||!b||!cls)return;const e={id:uid(),studentId:sid,classId:cls.id,buttonId:bid,label:b.label,icon:b.icon,type:b.type,start:new Date().toISOString(),end:null};data.events.push(e);save();toast=`${b.icon} ${b.label} recorded for ${s.name}.`;if(b.type==="event")selected={student:s,eventId:e.id};render()}
window.returnEvent=(id,status)=>{const e=data.events.find(x=>x.id===id);if(!e)return;e.end=new Date().toISOString();e.status=status;save();render()}
window.note=(sid,eid)=>{const student=data.students.find(x=>x.id===sid);if(student){selected={student,eventId:eid};render()}}
window.closeNote=()=>{selected=null;render()}
window.saveNote=()=>{const text=$("#noteText")?.value.trim();if(text&&selected){data.notes.push({id:uid(),studentId:selected.student.id,eventId:selected.eventId||null,text,created:new Date().toISOString()});save();toast="Note saved.";selected=null;render()}}
window.addStudent=()=>{const name=$("#newStudent")?.value.trim();if(name){data.students.push({id:uid(),name});save();render()}}
window.deleteStudent=id=>{
  const st=data.students.find(x=>x.id===id);if(!st)return;
  if(!confirm(`Delete ${st.name}? This will remove the student from all classes and permanently delete their events and notes.`))return;
  data.students=data.students.filter(x=>x.id!==id);
  data.classes.forEach(c=>c.studentIds=(c.studentIds||[]).filter(sid=>sid!==id));
  data.events=data.events.filter(e=>e.studentId!==id);
  data.notes=data.notes.filter(n=>n.studentId!==id);
  (data.gradeCourses||[]).forEach(c=>{if(c.grades)delete c.grades[id]});
  save();render();
}
function ordinal(n){return `${n}${n===1?"st":n===2?"nd":n===3?"rd":"th"}`}
function ruleEditor(rule,index){
  const r=rule||{id:uid(),periods:[],days:[1,2,3,4,5]};
  const p=Array.from({length:9},(_,i)=>i+1).map(n=>`<label><input type="checkbox" name="rule-period-${index}" value="${n}" ${(r.periods||[]).includes(n)?"checked":""}> ${ordinal(n)} Period</label>`).join("");
  const d=DAY_NAMES.map(([day,name])=>`<label><input type="checkbox" name="rule-day-${index}" value="${day}" ${(r.days||[]).includes(day)?"checked":""}> ${name}</label>`).join("");
  return `<div class="card scheduleRule" data-rule-id="${esc(r.id)}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Scheduling Rule ${index+1}</b><button type="button" onclick="window.removeClassRule(this)">Remove Rule</button></div><span class="sectionLabel">Periods</span><div class="checkGrid">${p}</div><span class="sectionLabel">Meeting Days</span><div class="checkGrid">${d}</div></div>`;
}
window.openClassModal=(id="")=>{
  ensureClassFields();document.querySelector("#classModal")?.remove();
  const existing=id?data.classes.find(c=>c.id===id):null,c=existing?structuredClone(existing):{id:"",name:"",studentIds:[],rules:[{id:uid(),periods:[],days:[1,2,3,4,5]}],terms:["fullYear"]};
  const checks=(items,selected,prefix)=>items.map(([v,label])=>`<label><input type="checkbox" name="${prefix}" value="${v}" ${selected.includes(v)?"checked":""}> ${label}</label>`).join("");
  const rules=(c.rules&&c.rules.length)?c.rules:[{id:uid(),periods:c.periods||[],days:c.days||[1,2,3,4,5]}];
  document.body.insertAdjacentHTML("beforeend",`<div id="classModal" class="modalbg"><div class="modal classEditor"><h3>${existing?"Edit":"Add"} Class</h3><label>Class Name<br><input id="className" value="${esc(c.name)}" placeholder="e.g., Honors Precalculus" style="width:100%"></label><span class="sectionLabel">When does this class meet?</span><p class="small">Add as many scheduling rules as you need. For example: Period 7 on MTWF, plus Periods 6 and 7 on Thursday.</p><div id="classRules">${rules.map(ruleEditor).join("")}</div><button type="button" onclick="window.addClassRule()">＋ Add Another Scheduling Rule</button><span class="sectionLabel">Course Length</span><p class="small">Choose the part(s) of the year when this class is active. Full Year keeps it active all year.</p><div class="checkGrid">${checks(TERM_OPTIONS,c.terms,"term")}</div><div style="margin-top:16px"><button class="primary" onclick="window.saveClass('${c.id}')">Save Class</button> <button onclick="window.closeClassModal()">Cancel</button></div></div></div>`);
}
window.addClassRule=()=>{const box=document.querySelector("#classRules");if(!box)return;const i=box.querySelectorAll(".scheduleRule").length;box.insertAdjacentHTML("beforeend",ruleEditor({id:uid(),periods:[],days:[1,2,3,4,5]},i));}
window.removeClassRule=btn=>{const rules=document.querySelectorAll("#classRules .scheduleRule");if(rules.length<=1){alert("A class needs at least one scheduling rule. You can leave its periods empty if you do not want it to appear automatically.");return;}btn.closest(".scheduleRule")?.remove();document.querySelectorAll("#classRules .scheduleRule").forEach((el,i)=>{const b=el.querySelector("b");if(b)b.textContent=`Scheduling Rule ${i+1}`;});}
window.closeClassModal=()=>document.querySelector("#classModal")?.remove();
window.saveClass=oldId=>{
  const name=("#className"&&$("#className")?.value||"").trim();if(!name){alert("Please enter a class name.");return;}
  const ruleEls=[...document.querySelectorAll("#classRules .scheduleRule")];
  const rules=ruleEls.map((el,i)=>({id:el.dataset.ruleId||uid(),periods:[...el.querySelectorAll(`input[name^="rule-period-"]:checked`)].map(x=>Number(x.value)),days:[...el.querySelectorAll(`input[name^="rule-day-"]:checked`)].map(x=>Number(x.value))}));
  if(rules.some(r=>!r.days.length)){alert("Each scheduling rule needs at least one meeting day.");return;}
  const terms=[...document.querySelectorAll('input[name="term"]:checked')].map(x=>x.value);if(!terms.length){alert("Please choose at least one course length option.");return;}
  if(rules.every(r=>!r.periods.length)&&!confirm("No periods are selected, so this class will not automatically appear on the Live Class page. Save anyway?"))return;
  const old=data.classes.find(c=>c.id===oldId);
  const item={id:oldId||uid(),name,studentIds:old?.studentIds||[],rules,periods:[...new Set(rules.flatMap(r=>r.periods))],days:[...new Set(rules.flatMap(r=>r.days))],terms};
  if(oldId){const i=data.classes.findIndex(c=>c.id===oldId);if(i>=0)data.classes[i]=item;}else data.classes.push(item);
  save();window.closeClassModal();render();
}
window.deleteClass=id=>{const c=data.classes.find(x=>x.id===id);if(!c)return;if(!confirm(`Delete ${c.name}? This will not delete the students themselves.`))return;data.classes=data.classes.filter(x=>x.id!==id);save();render();}
window.addClass=()=>window.openClassModal();
window.roster=(cid,sid,on)=>{const c=data.classes.find(x=>x.id===cid);if(!c)return;c.studentIds=on?[...new Set([...c.studentIds,sid])]:c.studentIds.filter(x=>x!==sid);save()}
window.addButton=()=>{const label=$("#qbLabel")?.value.trim();if(label){data.buttons.push({id:uid(),icon:$("#qbIcon")?.value||"⚡",label,type:$("#qbType")?.value||"event"});save();render()}}
window.deleteButton=id=>{data.buttons=data.buttons.filter(x=>x.id!==id);save();render()}
window.addCourse=()=>{const name=$("#courseName")?.value.trim();if(name){data.gradeCourses.push({id:uid(),name,components:[],grades:{}});save();render()}}
window.addComponent=cid=>{const name=$(`#comp-${cid}`)?.value.trim(),weight=Number($(`#weight-${cid}`)?.value);if(name&&weight){const c=data.gradeCourses.find(x=>x.id===cid);if(c){c.components.push({id:uid(),name,weight});save();render()}}}
window.setGrade=(cid,sid,coid,val)=>{const c=data.gradeCourses.find(x=>x.id===cid);if(!c)return;c.grades[sid]??={};c.grades[sid][coid]=val;save()}
window.setTotalDays=v=>{data.totalSchoolDays=Number(v);save()}
window.uploadAvatar=input=>{
  const file=input.files?.[0];if(!file)return;
  if(file.size>500000){alert("Please choose an image smaller than 500 KB so your dashboard stays lightweight.");input.value="";return}
  const reader=new FileReader();
  reader.onload=e=>{data.profileAvatar=e.target.result;save();render()};
  reader.readAsDataURL(file);
}
window.useGooglePhoto=()=>{data.profileAvatar="";save();render()}
window.exportData=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`teacher-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
}
window.importData=input=>{
  const file=input.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const incoming=JSON.parse(e.target.result);if(!confirm("Import this backup and replace the current dashboard data?"))return;data={...seed,...incoming};save();toast="Backup imported successfully.";render()}catch{alert("That file does not appear to be a valid Teacher Dashboard backup.")}};
  reader.readAsText(file);
}
window.resetData=()=>{if(confirm("Reset all dashboard data to the demo data?")){data=structuredClone(seed);save();render()}}

$("#root").innerHTML=`<div class="loadingScreen">Loading Teacher Dashboard...</div>`;
</script>
</body>
</html>
