function formatClock(ms){

function timeLeftInBlock(){
  const block=currentScheduleBlock();if(!block)return null;
  const row=(block.schedule.periods||[]).find(r=>r[0]===block.label);if(!row)return null;
  const now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),end=timeToMinutes(row[2],nowMin);
  if(end===null)return null;
  let diff=end-nowMin;
  // At the start of a minute, the display immediately reflects that minute.
  const seconds=now.getSeconds();
  return Math.max(0,diff*60000-seconds*1000-now.getMilliseconds());
}

function parseCloudDashboard(record){
  if(record?.dataJson){
    try{return JSON.parse(record.dataJson)}catch(err){console.error("Could not parse cloud dashboard:",err)}

  return record?.data||null;
}

async function loadCloudData(){
  if(!currentUser)return;
  cloudStatus="Loading your dashboard...";normalizeStudents();
render();
  data=loadLocalForUser();
  try{
    const snap=await getDoc(dashboardRef());
    // Only the new JSON format is loaded automatically. Older Firestore data may be
    // stale from before bell schedules were added, so this device's current local data
    // is preserved and migrated to the new format instead of being overwritten.
    const cloudDashboard=(snap.exists()&&snap.data()?.dataJson)?parseCloudDashboard(snap.data()):null;
    if(cloudDashboard){
      const localAvatar=loadLocalForUser().profileAvatar||"";
      data={...seed,...cloudDashboard,profileAvatar:localAvatar}; ensureBellSchedules(); ensureClassFields();
      lastSyncAt=snap.data().updatedAt||null;
      cloudStatus="Firebase synced";
      saveLocal();
    }else{
      cloudStatus="Firebase synced";
      const record=cloudRecord();
      await setDoc(dashboardRef(),record,{merge:true});
      lastSyncAt=record.updatedAt;
    }
  }catch(err){
    console.error(err);
    cloudStatus="Saved locally — cloud sync failed";
  }
  initializedUserData=true;
  render();
}

function save(){
  saveLocal();
  if(!currentUser||!initializedUserData)return;
  cloudSavePending=true;
  cloudStatus="Saving to Firebase...";
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(syncCloud,350);
}
async function syncCloud(){
  if(!currentUser||cloudWriteInProgress)return;
  cloudSavePending=true;
  if(cloudWriteInProgress)return;
  cloudWriteInProgress=true;
  try{
    while(cloudSavePending){
      cloudSavePending=false;
      cloudStatus="Saving to Firebase...";
      render();
      const record=cloudRecord();
      await setDoc(dashboardRef(),record,{merge:true});
      lastSyncAt=record.updatedAt;
      cloudStatus="Firebase synced";
    }
  }catch(err){
    console.error("Firebase save failed:",err);
    cloudStatus="Saved locally — cloud sync failed";
  }finally{
    cloudWriteInProgress=false;
    render();
  }
}

function instructionalResponsibilityDays(cls,studentId){
  const today=todayISO(),start=schoolStartDate(),end=schoolEndDate();
  if(!start||!end)return {count:0,total:178};
  const history=(cls.rosterHistory||[]).filter(r=>r.studentId===studentId);
  let intervals=history.length?history:[{start,end:null}];
  let count=0;
  for(let d=new Date(start+"T12:00:00");d<=new Date(end+"T12:00:00");d.setDate(d.getDate()+1)){
    const iso=d.toISOString().slice(0,10);
    if(!isInstructionalOrInServiceDay(iso)||isPreStudentInService(iso))continue;
    if(intervals.some(r=>iso>=r.start&&(!r.end||iso<=r.end)))count++;
  }
  return {count,total:178};
}
function classEnrollmentPeriods(cls,studentId){
  cls.enrollmentPeriods=Array.isArray(cls.enrollmentPeriods)?cls.enrollmentPeriods:[];
  let periods=cls.enrollmentPeriods.filter(p=>p.studentId===studentId);
  if(!periods.length){
    periods=[{id:"ep_"+Math.random().toString(36).slice(2),studentId,start:schoolStartDate()||"",end:schoolEndDate()||""}];
    cls.enrollmentPeriods.push(...periods);
  }
  return periods;
}
function pvaasDaysForPeriod(start,end){
  if(!start||!end)return 0; let n=0;
  for(let d=new Date(start+"T12:00:00");d<=new Date(end+"T12:00:00");d.setDate(d.getDate()+1)){
    const iso=d.toISOString().slice(0,10);
    if(isInstructionalOrInServiceDay(iso)&&!isPreStudentInService(iso))n++;
  } return n;
}
function pvaasTotalDays(){
  const start=schoolStartDate(),end=schoolEndDate(); return start&&end?pvaasDaysForPeriod(start,end):178;
}

function ensurePvaasData(){
  if(!Array.isArray(data.pvaasCohorts)||!data.pvaasCohorts.length)data.pvaasCohorts=[{id:"all",name:"All PVAAS Students"}];
  if(!data.pvaasCohorts.some(c=>c.id==="all"))data.pvaasCohorts.unshift({id:"all",name:"All PVAAS Students"});
  data.pvaasStudentCohorts=data.pvaasStudentCohorts&&typeof data.pvaasStudentCohorts==="object"?data.pvaasStudentCohorts:{};
}
function pvaasCohortId(studentId){ensurePvaasData();const id=data.pvaasStudentCohorts[studentId]||"all";return data.pvaasCohorts.some(c=>c.id===id)?id:"all"}
function mergeEnrollmentPeriods(periods){
  const sorted=periods.filter(p=>p.start&&p.end).map(p=>({start:p.start,end:p.end})).sort((a,b)=>a.start.localeCompare(b.start));
  const merged=[];
  for(const p of sorted){
    const last=merged[merged.length-1];
    if(!last){merged.push({...p});continue;}
    const nextDay=new Date(last.end+"T12:00:00");nextDay.setDate(nextDay.getDate()+1);
    const nextISO=nextDay.toISOString().slice(0,10);
    if(p.start<=nextISO&&p.end>last.end)last.end=p.end; else if(p.start>nextISO)merged.push({...p});
  }
  return merged;
}
function pvaasRows(){
  ensurePvaasData();ensureClassFields();
  const classes=data.classes.filter(c=>c.pvaasReported);
  const byStudent=new Map();
  classes.forEach(cls=>(cls.studentIds||[]).forEach(sid=>{
    const st=data.students.find(s=>s.id===sid);if(!st)return;
    if(!byStudent.has(sid))byStudent.set(sid,{student:st,classes:[]});
    byStudent.get(sid).classes.push(cls);
  }));
  return sortedStudents([...byStudent.values()].map(x=>x.student)).map(st=>{
    const entry=byStudent.get(st.id);
    const allPeriods=entry.classes.flatMap(cls=>classEnrollmentPeriods(cls,st.id));
    const merged=mergeEnrollmentPeriods(allPeriods);
    const days=merged.reduce((sum,p)=>sum+pvaasDaysForPeriod(p.start,p.end),0);
    return {...entry,merged,days};
  });
}

  <p class="small" style="margin-top:10px">${classes.length?`${classes.length} course${classes.length===1?"":"s"} selected for PVAAS · ${rows.length} unique student${rows.length===1?"":"s"} · ${total} instructional days`:`No courses are currently marked for PVAAS.`}</p></section>
  ${classes.length?`<section class="card"><h3>Student Responsibility Matrix</h3><p class="small">Students are alphabetized by last name. If a student is enrolled in more than one PVAAS class, they appear only once in this matrix.</p><div class="pvaasMatrixWrap"><table class="pvaasTable"><thead><tr><th>Student</th><th>% Responsible</th><th>Enrollment Period(s)</th><th>Responsibility Days</th><th>Cohort</th></tr></thead><tbody>${filtered.map(r=>{const st=r.student;const pct=total?Math.round(r.days/total*1000)/10:0;const cohortId=pvaasCohortId(st.id);return `<tr><td><b>${esc(studentDisplayName(st))}</b></td><td><b>${pct}%</b></td><td><div class="pvaasPeriodsInline">${r.classes.map(cls=>{const periods=classEnrollmentPeriods(cls,st.id);return periods.map(p=>`<div class="pvaasPeriodInline"><label>Enroll <input type="date" value="${p.start||""}" onchange="window.updateEnrollmentPeriod('${cls.id}','${p.id}','start',this.value)"></label><label>Unenroll <input type="date" value="${p.end||""}" onchange="window.updateEnrollmentPeriod('${cls.id}','${p.id}','end',this.value)"></label>${periods.length>1?`<button type="button" class="tinyBtn" title="Remove period" onclick="window.removeEnrollmentPeriod('${cls.id}','${p.id}')">×</button>`:""}</div>`).join("")+`<button type="button" class="tinyBtn" onclick="window.addEnrollmentPeriod('${cls.id}','${st.id}')">+ Period</button>`}).join("")}</div></td><td><b>${r.days} / ${total}</b></td><td><select onchange="window.setPvaasStudentCohort('${st.id}',this.value)">${data.pvaasCohorts.map(c=>`<option value="${c.id}" ${cohortId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></td></tr>`;}).join("")||`<tr><td colspan="5" class="small">No students in this cohort yet.</td></tr>`}</tbody></table></div></section>`:`<section class="card"><p class="small">Go to Students & Classes → Edit the course → PVAAS Reporting and check “Report this course for PVAAS.”</p></section>`}`;
}

function classPeriodNumber(label){const m=String(label||"").match(/^(\d+)(?:st|nd|rd|th)?\s+Period\b/i);return m?Number(m[1]):null}
function timeToMinutes(value,previous=-1){
  const m=String(value||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);if(!m)return null;
  let h=Number(m[1]),min=Number(m[2]||0),ampm=(m[3]||"").toLowerCase();
  if(ampm){if(h===12)h=0;if(ampm==="pm")h+=12;}else{let raw=h*60+min;if(previous>=0&&raw+360<previous)raw+=720;return raw;}
  return h*60+min;
}
function currentScheduleBlock(date=new Date()){
  const info=getDateInfo(todayISO());if(info.type!=="instructional")return null;
  const schedule=bellScheduleById(info.schedule||"regular"),now=date.getHours()*60+date.getMinutes();let previous=-1;
  for(const row of schedule.periods||[]){let begin=timeToMinutes(row[1],previous);if(begin===null)continue;let end=timeToMinutes(row[2],begin);if(end!==null&&end<begin)end+=720;previous=end??begin;if(end!==null&&now>=begin&&now<end)return {label:row[0],period:classPeriodNumber(row[0]),schedule};}
  return null;
}
function markerIndex(key,date){

function currentTermCodes(date=todayISO()){
  return {q:markerIndex("nineWeeks",date),t:markerIndex("trimester",date),s:markerIndex("semester",date)};

function classIsActiveToday(c,date=todayISO()){
  const info=getDateInfo(date);if(info.type!=="instructional")return false;
  const terms=c.terms||["fullYear"];if(terms.includes("fullYear"))return true;
  const cur=currentTermCodes(date),hasMarkers=cur.q||cur.t||cur.s;
  if(!hasMarkers)return true;
  return terms.includes(`q${cur.q}`)||terms.includes(`t${cur.t}`)||terms.includes(`s${cur.s}`);
}
function classHasRuleNow(c,weekday,period){
  const rules=(c.rules&&c.rules.length)?c.rules:[{periods:c.periods||[],days:c.days||[1,2,3,4,5]}];

function rangeStart(range){const now=new Date();const d=new Date(now);d.setHours(0,0,0,0);if(range==="week"){const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day)}else if(range==="month")d.setDate(1);else if(range==="year"){d.setMonth(0,1)}return d}

const DAY_NAMES=[[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"]];
const TERM_OPTIONS=[["fullYear","Full Year"],["q1","Quarter 1"],["q2","Quarter 2"],["q3","Quarter 3"],["q4","Quarter 4"],["t1","Trimester 1"],["t2","Trimester 2"],["t3","Trimester 3"],["s1","Semester 1"],["s2","Semester 2"]];
function classMeta(c){
  const rules=(c.rules&&c.rules.length)?c.rules:[{periods:c.periods||[],days:c.days||[]}];
  const ruleText=rules.map(r=>{const ds=DAY_NAMES.filter(([d])=>(r.days||[]).includes(d)).map(([,n])=>n).join("");const ps=(r.periods||[]).join(", ");return `${ds||"No days"}: Period${(r.periods||[]).length===1?"":"s"} ${ps||"—"}`}).join(" | ");
  const termText=(c.terms||["fullYear"]).map(t=>TERM_OPTIONS.find(x=>x[0]===t)?.[1]||t).join(" · ");
  return `<div class="classMeta"><span>${esc(ruleText)}</span><span>${esc(termText)}</span></div>`;
}

function splitStudentName(name){
  const parts=(name||"").trim().split(/\s+/).filter(Boolean);
  return {firstName:parts.shift()||"",lastName:parts.join(" ")};
}
function studentFirstName(s){
  if((s.firstName||"").trim())return s.firstName.trim();
  return splitStudentName(s.name).firstName;
}
function studentLastName(s){
  if(s.lastName!==undefined && (s.lastName||"").trim())return s.lastName.trim();
  return splitStudentName(s.name).lastName;
}
function studentDisplayName(s){
  const first=studentFirstName(s),last=studentLastName(s);
  return [first,last].filter(Boolean).join(" ") || s.name || "Unnamed Student";
}
function normalizeStudents(){
  data.students??=[];
  data.students.forEach(s=>{
    // Repair the accidental V1.6.16 migration that duplicated first names.
    let first=(s.firstName||"").trim();
    let last=(s.lastName||"").trim();
    const current=(s.name||"").trim();

    if(!first && !last){
      const split=splitStudentName(current);
      first=split.firstName; last=split.lastName;
    }else{
      if(!first) first=splitStudentName(current).firstName;
      if(!last) last=splitStudentName(current).lastName;

      // Example bad V1.6.16 data: firstName="Abrianna", lastName="Abrianna DeBolt"
      if(first && last && last.toLowerCase().startsWith(first.toLowerCase()+" ")){
        last=last.slice(first.length).trim();
      }
      // Example bad display name: "Abrianna Abrianna DeBolt"
      const doubledPrefix=(first+" "+first+" ").toLowerCase();
      if(first && current.toLowerCase().startsWith(doubledPrefix) && !last){
        last=current.slice((first+" "+first+" ").length).trim();
      }
    }

    s.firstName=first;
    s.lastName=last;
    s.name=[first,last].filter(Boolean).join(" ") || current || "Unnamed Student";
  });
}
function sortedStudents(list=data.students){
  normalizeStudents();
  return [...list].sort((a,b)=>{
    const la=studentLastName(a).localeCompare(studentLastName(b),undefined,{sensitivity:"base"});
    if(la)return la;
    return studentFirstName(a).localeCompare(studentFirstName(b),undefined,{sensitivity:"base"});
  });
}

function isoAddDays(date,n){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function isWeekday(date){const d=new Date(date+"T12:00:00").getDay();return d!==0&&d!==6}
function baseDateType(date){
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  return within&&isWeekday(date)?"instructional":"outside";
}

// Shared school-year helpers. These read directly from calendar settings and
// overrides so the Calendar and PVAAS pages use the same counting rules.
function schoolStartDate(){return (data.calendarSettings||{}).firstStudentDay||""}
function schoolEndDate(){return (data.calendarSettings||{}).lastStudentDay||""}
function isInstructionalOrInServiceDay(date){
  const o=(data.calendarOverrides||{})[date]||{};
  const type=o.type||baseDateType(date);
  return isWeekday(date)&&(type==="instructional"||type==="inservice");
}
function isPreStudentInService(date){
  const start=schoolStartDate();
  return !!(start&&date<start);
}
function getDateInfo(date){
  const o=(data.calendarOverrides||{})[date]||{};
  const type=o.type||baseDateType(date);
  const s=data.calendarSettings||{};
  const within=!!(s.firstStudentDay&&s.lastStudentDay&&date>=s.firstStudentDay&&date<=s.lastStudentDay);
  const counted=within&&isWeekday(date)&&(type==="instructional"||type==="inservice");
  const markers={
    nineWeeks:!!o.nineWeeks,endNineWeeks:!!o.endNineWeeks,
    trimester:!!o.trimester,endTrimester:!!o.endTrimester,
    semester:!!o.semester,endSemester:!!o.endSemester
  };
  let schedule=o.schedule!==undefined?o.schedule:(type==="instructional"?"regular":"");
  if(schedule==="alternate")schedule="regular";
  ensureBellSchedules();
  if(schedule&&!data.bellSchedules.some(s=>s.id===schedule))schedule="regular";
  return {type,counted,markers,schedule,countedDay:counted?countedDaysBefore(date):0};
}
function countedDaysBefore(date){
  const s=data.calendarSettings||{};
  if(!s.firstStudentDay||!s.lastStudentDay||date<s.firstStudentDay)return 0;
  const end=date>s.lastStudentDay?s.lastStudentDay:date;
  let count=0,d=s.firstStudentDay;
  while(d<=end){
    const o=(data.calendarOverrides||{})[d]||{};
    const type=o.type||baseDateType(d);
    if(isWeekday(d)&&(type==="instructional"||type==="inservice"))count++;
    d=isoAddDays(d,1);
  }
  return count;
}
function countedDaysTotal(){
  const s=data.calendarSettings||{};
  return s.firstStudentDay&&s.lastStudentDay?countedDaysBefore(s.lastStudentDay):0;
}



function calendarColors(){
  const defaults={
    instructional:"#4f9d69",inservice:"#8b6bb8",noschool:"#cf5f5f",
    nineWeeks:"#d59627",endNineWeeks:"#c77b20",
    trimester:"#3f7fc0",endTrimester:"#2f679e",
    semester:"#6c63a8",endSemester:"#514a8a",
    alternateSchedule:"#b05c8a",note:"#556070"
  };
  return {...defaults,...(data.calendarColors||{})};
}
function eventColor(date,key){
  return ((data.calendarOverrides||{})[date]?.colors||{})[key] || calendarColors()[key];
}
function hexToRgba(hex,alpha=.11){
  const h=String(hex||"").replace("#","").trim();
  if(!/^[0-9a-fA-F]{6}$/.test(h))return `rgba(255,255,255,${alpha})`;
  const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},${alpha})`;
}
function calendarAppearance(date,info){
  // Alternate schedules get visual priority because they are the exception
  // that changes how an otherwise instructional day runs.
  let key="";
  if(info.schedule&&info.schedule!=="regular") key="alternateSchedule";
  else if(["instructional","inservice","noschool"].includes(info.type)) key=info.type;
  if(!key)return {color:"#e0e4ec",background:"#f7f8fa"};
  const color=eventColor(date,key);
  return {color,background:hexToRgba(color,.11)};
}
function todayISO(){return new Date().toISOString().slice(0,10)}
function calendarNotesFor(date){return ((data.calendarOverrides||{})[date]||{}).notes||[]}

function academicMarkerHTML(kind,color,index){
  const defs={nineWeeks:["Q-Beg",`Begin Quarter ${index||""}`],endNineWeeks:["Q-End",`End Quarter ${index||""}`],trimester:["T-Beg",`Begin Trimester ${index||""}`],endTrimester:["T-End",`End Trimester ${index||""}`],semester:["S-Beg",`Begin Semester ${index||""}`],endSemester:["S-End",`End Semester ${index||""}`]};
  const [symbol,title]=defs[kind];
  return `<span class="markerCard" style="color:${color}" title="${title}">${symbol}</span>`;
}
function upcomingCalendarEvents(limit=8){
  const today=todayISO(), events=[];
  Object.keys(data.calendarOverrides||{}).filter(d=>d>=today).sort().forEach(date=>{
    const o=data.calendarOverrides[date]||{}, info=getDateInfo(date);
    if(info.schedule&&info.schedule!=="regular")events.push({date,label:bellScheduleName(info.schedule),kind:"Alternate Bell Schedule",color:eventColor(date,"alternateSchedule")});
    [["endNineWeeks","End of Nine Weeks","endNineWeeks"],["nineWeeks","Beginning of Nine Weeks","nineWeeks"],["endTrimester","End of Trimester","endTrimester"],["trimester","Beginning of Trimester","trimester"],["endSemester","End of Semester","endSemester"],["semester","Beginning of Semester","semester"]].forEach(([key,label,colorKey])=>{if(o[key])events.push({date,label,kind:"Academic Marker",color:eventColor(date,colorKey)})});
    if((o.notes||[]).length)events.push({date,label:o.notes[0],kind:"Note",color:eventColor(date,"note")});
    if(info.type==="inservice")events.push({date,label:"In-Service Day",kind:"School Calendar",color:eventColor(date,"inservice")});
    if(info.type==="noschool")events.push({date,label:"No School",kind:"School Calendar",color:eventColor(date,"noschool")});
  });
  return events.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,limit);
}
function calendarDayProgress(iso){
  const start=schoolStartDate(),end=schoolEndDate();
  if(!start||!end||iso<start||iso>end)return null;
  const info=getDateInfo(iso);
  if(!info.counted)return null;
  const current=countedDaysBefore(iso);
  const total=countedDaysTotal();
  return current?`${current}/${Math.max(0,total-current)}`:null;
}

function gradeEligibleClasses(){
  ensureClassFields();
  return data.classes.filter(c=>c.graded&&!c.terms.some(x=>["t1","t2","t3"].includes(x)));
}
function gradeComponents(c){
  const terms=c.terms||[];
  const qs=terms.includes("fullYear")?["q1","q2","q3","q4"]:
    terms.includes("s1")?["q1","q2"]:terms.includes("s2")?["q3","q4"]:[];
  const comps=qs.map(q=>({id:q,label:q.toUpperCase(),kind:"quarter"}));
  if(c.giveMidterm)comps.push({id:"midterm",label:"Midterm",kind:"exam"});
  if(c.giveFinal)comps.push({id:"final",label:"Final",kind:"exam"});
  return comps;
}
function baseWeights(c){
  const comps=gradeComponents(c),qs=comps.filter(x=>x.kind==="quarter"),ex=comps.filter(x=>x.kind==="exam");
  const w={};
  if(ex.length===2){qs.forEach(x=>w[x.id]=1);ex.forEach(x=>w[x.id]=.5)}
  else if(ex.length===1){[...qs,...ex].forEach(x=>w[x.id]=1)}
  else qs.forEach(x=>w[x.id]=1);
  return w;
}
function currentAverage(c,sid){
  const grades=c.grades?.[sid]||{},w=baseWeights(c);
  const entered=Object.keys(w).filter(id=>grades[id]!==""&&grades[id]!==undefined&&grades[id]!==null&&!Number.isNaN(Number(grades[id])));
  if(!entered.length)return "";
  const totalW=entered.reduce((s,id)=>s+w[id],0);
  return entered.reduce((s,id)=>s+Number(grades[id])*w[id],0)/totalW;
}
function recommendationFor(c,avg){
  if(avg===""||avg===null||!c.usesRecommendations)return "";
  for(const r of c.recommendationRules||[]){
    const op=r.op||"lte",a=Number(r.a),b=Number(r.b);
    if((op==="lte"&&avg<=a)||(op==="gte"&&avg>=a)||(op==="between"&&avg>=Math.min(a,b)&&avg<=Math.max(a,b)))return r.title||"";
  }
  return "";
}

rn `<tr><td><b>${esc(c.name)}</b></td>${(eventFilter==="all"?buttons:buttons.filter(b=>b.id===eventFilter)).map(b=>`<td>${countButton(ev,b.id)}</td>`).join("")}<td><b>${ev.length}</b></td></tr>`}).join("")||`<tr><td colspan="${buttons.length+2}" class="small">No class data yet.</td></tr>`}</tbody></table></div><h4>Notes</h4>${notes.map(n=>`<p>📝 ${esc(n.text)} <span class="small">${new Date(n.created).toLocaleString()}</span></p>`).join("")||"<p>None recorded.</p>"}`:"<p>No students match your current filter.</p>"}</section>${recentEventsHTML()}`;

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function canJoinGroup(id,group){return !group.some(other=>isRestrictedPair(id,other))}
window.generateGroups=()=>{
  ensureClassroomTools();const size=Math.max(2,Math.floor(Number($("#groupSize")?.value)||3));const ids=shuffle(currentToolRoster().map(s=>s.id));
  if(!ids.length){alert("There are no students available.");return;}
  const groups=[];const difficult=[];
  for(const id of ids){
    let candidates=groups.filter(g=>g.length<size&&canJoinGroup(id,g));
    candidates.sort((a,b)=>a.length-b.length);
    if(candidates.length)candidates[0].push(id);else difficult.push(id);
  }
  for(const id of difficult){
    let candidates=groups.filter(g=>canJoinGroup(id,g));candidates.sort((a,b)=>a.length-b.length);
    if(candidates.length&&candidates[0].length<size+1)candidates[0].push(id);else groups.push([id]);
  }
  data.classroomTools.groups=groups;save();render();
}
window.clearGroups=()=>{ensureClassroomTools();data.classroomTools.groups=[];save();render();}

  document.body.insertAdjacentHTML("beforeend",`<div id="restrictionModal" class="modalbg"><div class="modal"><h3>Do Not Work With</h3><p class="small">These pairs will be kept apart whenever possible when groups are generated for the current class.</p><div style="max-height:55vh;overflow:auto">${pairs.join("")}</div><div style="margin-top:14px"><button class="primary" onclick="window.saveRestrictions()">Save</button> <button onclick="document.querySelector('#restrictionModal')?.remove()">Cancel</button></div></div></div>`);
}

window.toggleReportTimedFields=()=>{const b=data.buttons.find(x=>x.id===$("#reportEventButton")?.value);const box=$("#reportTimedFields");if(box)box.style.display=b?.type==="timed"?"block":"none";}
window.closeReportEventModal=()=>document.querySelector("#reportEventModal")?.remove();
window.classForStudentAt=(sid,date,period)=>{const weekday=new Date(date+"T12:00:00").getDay();return data.classes.find(c=>(c.studentIds||[]).includes(sid)&&classIsActiveToday(c,date)&&classHasRuleNow(c,weekday,Number(period)))||null;}
window.saveReportEvent=sid=>{
  const date=$("#reportEventDate")?.value,period=$("#reportEventPeriod")?.value;if(!date||!period){alert("Please choose both a date and period.");return;}
  const b=data.buttons.find(x=>x.id===$("#reportEventButton")?.value);if(!b){alert("Please choose an event type.");return;}
  let classId=$("#reportEventClass")?.value||"";if(classId==="auto"){classId=window.classForStudentAt(sid,date,period)?.id||"";}
  const label=$("#reportEventLabel")?.value.trim()||b.label,icon=$("#reportEventIcon")?.value.trim()||b.icon;
  let start,end=null;
  if(b.type==="timed"){const stime=$("#reportEventStartTime")?.value,etime=$("#reportEventEndTime")?.value;if(!stime){alert("Please enter the time the student left the room.");return;}start=fromLocalInput(`${date}T${stime}`);end=etime?fromLocalInput(`${date}T${etime}`):null;if(end&&new Date(end)<new Date(start)){alert("Return time cannot be before out time.");return;}}
  else start=fromLocalInput(`${date}T12:00`);
  data.events.push({id:uid(),studentId:sid,classId,buttonId:b.id,label,icon,type:b.type,start,end,period:Number(period),createdFromReport:true});

window.deleteEvent=id=>{const e=data.events.find(x=>x.id===id);if(!e)return;if(!confirm("Delete this event?"))return;data.events=data.events.filter(x=>x.id!==id);data.notes=data.notes.filter(n=>n.eventId!==id);save();toast="Event deleted.";render();}
window.addStudent=()=>{

  if(!firstName && !lastName){alert("Please enter a first or last name.");return;}

window.deleteStudent=id=>{
  const st=data.students.find(x=>x.id===id);if(!st)return;
  if(!confirm(`Delete ${st.name}? This will remove the student from all classes and permanently delete their events and notes.`))return;
  data.students=data.students.filter(x=>x.id!==id);
  data.classes.forEach(c=>c.studentIds=(c.studentIds||[]).filter(sid=>sid!==id));
  data.events=data.events.filter(e=>e.studentId!==id);
  data.notes=data.notes.filter(n=>n.studentId!==id);
  (data.gradeCourses||[]).forEach(c=>{if(c.grades)delete c.grades[id]});

    <div class="add" style="align-items:end;flex-wrap:wrap">
      <label style="flex:1;min-width:170px">First Name<br><input id="editStudentFirstName" value="${esc(st.firstName||"")}" style="width:100%"></label>

    </div>
    <details class="collapsibleFieldset"><summary>Classes</summary><div class="collapsibleInner"><p class="small">Check every class this student belongs to.</p><div class="checkGrid">${data.classes.map(c=>`<label><input type="checkbox" name="studentClass" value="${esc(c.id)}" ${(c.studentIds||[]).includes(st.id)?"checked":""}> ${esc(c.name)}</label>`).join("")||"<span class='small'>No classes yet. Add a class first.</span>"}</div></div></details>
    <details class="collapsibleFieldset"><summary>Do Not Seat With</summary><div class="collapsibleInner"><p class="small">These restrictions apply across all classes and are used when making groups.</p><div class="checkGrid">${sortedStudents(data.students.filter(other=>other.id!==st.id)).map(other=>`<label><input type="checkbox" name="studentRestriction" value="${esc(other.id)}" ${(st.doNotSeatWith||[]).includes(other.id)?"checked":""}> ${esc(studentDisplayName(other))}</label>`).join("")||"<span class='small'>Add other students first.</span>"}</div></div></details><div style="margin-top:16px"><button class="primary" onclick="window.saveStudent('${st.id}')">Save Student</button> <button onclick="window.closeStudentModal()">Cancel</button></div></div></div>`);
}
window.closeStudentModal=()=>document.querySelector("#studentModal")?.remove();
window.saveStudent=id=>{
  const st=data.students.find(x=>x.id===id);if(!st)return;
  const firstName=$("#editStudentFirstName")?.value.trim()||"";
  const lastName=$("#editStudentLastName")?.value.trim()||"";
  if(!firstName && !lastName){alert("Please enter a first or last name.");return;}
  st.firstName=firstName;st.lastName=lastName;st.name=[firstName,lastName].filter(Boolean).join(" ");
  const selectedIds=[...document.querySelectorAll('input[name="studentClass"]:checked')].map(x=>x.value);
  data.classes.forEach(c=>{const has=selectedIds.includes(c.id);c.studentIds=has?[...new Set([...(c.studentIds||[]),id])]:((c.studentIds||[]).filter(sid=>sid!==id));});
  const selectedRestrictions=[...document.querySelectorAll('input[name="studentRestriction"]:checked')].map(x=>x.value);
  st.doNotSeatWith=selectedRestrictions;
  data.students.forEach(other=>{if(other.id===id)return;other.doNotSeatWith=Array.isArray(other.doNotSeatWith)?other.doNotSeatWith:[];if(selectedRestrictions.includes(other.id)){if(!other.doNotSeatWith.includes(id))other.doNotSeatWith.push(id);}else other.doNotSeatWith=other.doNotSeatWith.filter(x=>x!==id);});
  save();window.closeStudentModal();render();
}
window.addStudentFromClassModal=()=>{
  const firstName=$("#newStudentInClassFirstName")?.value.trim()||"";
  const lastName=$("#newStudentInClassLastName")?.value.trim()||"";
  if(!firstName&&!lastName)return;
  const name=[firstName,lastName].filter(Boolean).join(" ");
  const st={id:uid(),firstName,lastName,name};data.students.push(st);
  const grid=$("#classStudentGrid");if(grid){const empty=grid.querySelector(".emptyStudents");if(empty)empty.remove();const label=document.createElement("label");label.innerHTML=`<input type="checkbox" name="classStudent" value="${esc(st.id)}" checked> ${esc(st.name)}`;grid.appendChild(label);}
  const a=$("#newStudentInClassFirstName"),b=$("#newStudentInClassLastName");if(a)a.value="";if(b)b.value="";
  save();toast=`${name} added. Assignments saved when you save the class.`;
}
function ordinal(n){return `${n}${n===1?"st":n===2?"nd":n===3?"rd":"th"}`}
function ruleEditor(r,index){
  const p=[1,2,3,4,5,6,7,8,9].map(n=>`<label><input type="checkbox" name="rule-period-${index}" value="${n}" ${(r.periods||[]).includes(n)?"checked":""}> ${ordinal(n)} Period</label>`).join("");
  const d=DAY_NAMES.map(([day,name])=>`<label><input type="checkbox" name="rule-day-${index}" value="${day}" ${(r.days||[]).includes(day)?"checked":""}> ${name}</label>`).join("");
  return `<div class="card scheduleRule" data-rule-id="${esc(r.id)}">
    <div class="scheduleRuleHeader"><b>Scheduling Rule ${index+1}</b><button type="button" onclick="window.removeClassRule(this)">Remove Rule</button></div>
    <span class="sectionLabel">Periods</span><div class="checkGrid periodGrid">${p}</div>
    <span class="sectionLabel">Meeting Days</span><div class="checkGrid dayGrid">${d}</div>
  </div>`;
}

window.addClassRule=()=>{const box=document.querySelector("#classRules");if(!box)return;const i=box.querySelectorAll(".scheduleRule").length;box.insertAdjacentHTML("beforeend",ruleEditor({id:uid(),periods:[],days:[1,2,3,4,5]},i));}
window.removeClassRule=btn=>{const rules=document.querySelectorAll("#classRules .scheduleRule");if(rules.length<=1){alert("A class needs at least one scheduling rule. You can leave its periods empty if you do not want it to appear automatically.");return;}btn.closest(".scheduleRule")?.remove();document.querySelectorAll("#classRules .scheduleRule").forEach((el,i)=>{const b=el.querySelector("b");if(b)b.textContent=`Scheduling Rule ${i+1}`;});}
window.closeClassModal=()=>document.querySelector("#classModal")?.remove();
window.saveClass=oldId=>{
  const name=("#className"&&$("#className")?.value||"").trim();if(!name){alert("Please enter a class name.");return;}
  const ruleEls=[...document.querySelectorAll("#classRules .scheduleRule")];
  const rules=ruleEls.map((el,i)=>({id:el.dataset.ruleId||uid(),periods:[...el.querySelectorAll(`input[name^="rule-period-"]:checked`)].map(x=>Number(x.value)),days:[...el.querySelectorAll(`input[name^="rule-day-"]:checked`)].map(x=>Number(x.value))}));
  if(rules.some(r=>!r.days.length)){alert("Each scheduling rule needs at least one meeting day.");return;}
  const selectedTerm=$("#classTerm")?.value||"fullYear";const terms=[selectedTerm];
  if(rules.every(r=>!r.periods.length)&&!confirm("No periods are selected, so this class will not automatically appear on the Live Class page. Save anyway?"))return;
  const old=data.classes.find(c=>c.id===oldId);
  const studentIds=[...document.querySelectorAll('input[name="classStudent"]:checked')].map(x=>x.value);
  const previous=old||{};
  const item={id:oldId||uid(),name,studentIds,rules,periods:[...new Set(rules.flatMap(r=>r.periods))],days:[...new Set(rules.flatMap(r=>r.days))],terms,
  graded:!!$("#classGraded")?.checked,giveMidterm:!!$("#classMidterm")?.checked,giveFinal:!!$("#classFinal")?.checked,
  usesRecommendations:!!$("#classRecommendations")?.checked,recommendationRules:previous.recommendationRules||[],grades:previous.grades||{},
  pvaasReported:!!$("#classPvaas")?.checked,enrollmentPeriods:previous.enrollmentPeriods||[],rosterHistory:previous.rosterHistory||[]};
  if(oldId){const i=data.classes.findIndex(c=>c.id===oldId);if(i>=0)data.classes[i]=item;}else data.classes.push(item);
  save();window.closeClassModal();render();
}
window.deleteClass=id=>{const c=data.classes.find(x=>x.id===id);if(!c)return;if(!confirm(`Delete ${c.name}? This will not delete the students themselves.`))return;data.classes=data.classes.filter(x=>x.id!==id);save();render();}
window.addClass=()=>window.openClassModal();
window.roster=(cid,sid,on)=>{const c=data.classes.find(x=>x.id===cid);if(!c)return;c.studentIds=on?[...new Set([...(c.studentIds||[]),sid])]:((c.studentIds||[]).filter(x=>x!==sid));save();toast=on?"Student assigned to class.":"Student removed from class.";render()}
window.addButton=()=>{const label=$("#qbLabel")?.value.trim();if(label){data.buttons.push({id:uid(),icon:$("#qbIcon")?.value||"⚡",label,type:$("#qbType")?.value||"event"});save();render()}}

 const c=data.classes.find(x=>x.id===cid);if(!c)return;c.grades??={};c.grades[sid]??={};c.grades[sid][key]=val===""?"":Number(val);save();
 const row=document.querySelector(`input[oninput*="'${cid}','${sid}'"]`)?.closest("tr");
 if(row){const avg=currentAverage(c,sid);const a=row.querySelector(".currentAvg");if(a)a.innerHTML=`<b>${avg===""?"—":avg.toFixed(2)+"%"}</b>`;const r=row.querySelector(".recommendationCell");if(r)r.textContent=recommendationFor(c,avg)||"—";}

window.openGradeSettings=id=>{
  const c=data.classes.find(x=>x.id===id);if(!c)return;

  <label><input id="gsFinal" type="checkbox" ${c.giveFinal?"checked":""}> Give Final</label><br>

function recommendationRuleEditor(r={},i=0){return `<div class="card recommendationRule" style="padding:10px;margin:8px 0"><select class="rrOp" onchange="window.toggleRecommendationBetween(this)"><option value="lte" ${(r.op||"lte")==="lte"?"selected":""}>Less than or equal to</option><option value="between" ${r.op==="between"?"selected":""}>Between</option><option value="gte" ${r.op==="gte"?"selected":""}>Greater than or equal to</option></select>
<input class="rrA" type="number" min="0" max="100" step="0.01" value="${esc(r.a??"")}" placeholder="%">
<span class="rrBetween" style="display:${r.op==="between"?"inline":"none"}"> and <input class="rrB" type="number" min="0" max="100" step="0.01" value="${esc(r.b??"")}" placeholder="%"></span>
→ <input class="rrTitle" value="${esc(r.title||"")}" placeholder="Recommended course title">
<button type="button" onclick="this.closest('.recommendationRule').remove()">Delete</button></div>`}
window.toggleRecommendationBetween=sel=>{const box=sel.closest(".recommendationRule").querySelector(".rrBetween");box.style.display=sel.value==="between"?"inline":"none";}
window.addRecommendationRule=()=>$("#recommendationRules").insertAdjacentHTML("beforeend",recommendationRuleEditor({},0));

window.saveGradeSettings=id=>{
 const c=data.classes.find(x=>x.id===id);if(!c)return;
 c.graded=!!$("#gsGraded")?.checked;c.giveMidterm=!!$("#gsMidterm")?.checked;c.giveFinal=!!$("#gsFinal")?.checked;c.usesRecommendations=!!$("#gsRecommendations")?.checked;
 c.recommendationRules=[...document.querySelectorAll(".recommendationRule")].map(el=>({op:el.querySelector(".rrOp").value,a:el.querySelector(".rrA").value,b:el.querySelector(".rrB")?.value||"",title:el.querySelector(".rrTitle").value.trim()})).filter(r=>r.title&&r.a!=="");
 save();window.closeGradeSettings();render();
}
window.setTotalDays=v=>{data.totalSchoolDays=Number(v);save()}
window.uploadAvatar=input=>{
  const file=input.files?.[0];if(!file)return;
  if(file.size>500000){alert("Please choose an image smaller than 500 KB so your dashboard stays lightweight.");input.value="";return}
  const reader=new FileReader();
  reader.onload=e=>{data.profileAvatar=e.target.result;save();render()};

window.useGooglePhoto=()=>{data.profileAvatar="";save();render()}
window.exportData=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`teacher-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
}
window.importData=input=>{
  const file=input.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{const incoming=JSON.parse(e.target.result);if(!confirm("Import this backup and replace the current dashboard data?"))return;data={...seed,...incoming};save();toast="Backup imported successfully.";render()}catch{alert("That file does not appear to be a valid Teacher Dashboard backup.")}};
  reader.readAsText(file);
}
window.resetData=()=>{if(confirm("Reset all dashboard data to the demo data?")){data=structuredClone(seed);save();render()}}
