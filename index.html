<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f4f6fb;color:#202532}.app{display:flex;min-height:100vh}
aside{width:235px;background:#263454;color:#fff;padding:18px;position:sticky;top:0;height:100vh}h1{font-size:22px;margin:0 0 22px}.nav{width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:#e3e8f6;text-align:left;font-size:14px;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:#3d4d73}.status{position:absolute;bottom:18px;font-size:12px;color:#cbd4e9}
main{flex:1;padding:26px;max-width:1500px;margin:auto;width:100%}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h2{margin:0}header p{margin:4px 0;color:#697386}.card,.student,.alert{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0000000c}.alert{border-left:4px solid #dba83d;margin-bottom:16px}.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.student h3{margin:0 0 12px}.quick{display:flex;flex-wrap:wrap;gap:6px}.quick button{padding:8px;border:1px solid #dce1eb;background:#fafbfe}.quick span{font-size:11px;margin-left:3px}.noteBtn{margin-top:10px;background:transparent;border:0;color:#425796}.out{background:#fff5d8;padding:10px;border-radius:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{margin-bottom:14px}.add{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}input,select,textarea{padding:9px;border:1px solid #ccd3df;border-radius:7px;font:inherit}button{padding:8px 12px;border:1px solid #cbd2df;border-radius:7px;background:#fff;cursor:pointer}button:hover{background:#eef2fa}textarea{width:100%;min-height:120px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e7eaf0;text-align:left}.grade{width:70px}.toast{position:fixed;right:20px;top:18px;background:#263454;color:#fff;padding:12px;border-radius:8px;z-index:10}.modalbg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20}.modal{background:#fff;padding:22px;border-radius:12px;width:min(500px,90vw)}.reportgrid{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#f1f4fa;border-radius:9px;padding:12px;min-width:100px;display:flex;flex-direction:column}.stat b{font-size:24px}.small{font-size:12px;color:#667085}
@media(max-width:750px){aside{width:62px;padding:8px}aside h1{font-size:0}.nav{font-size:0;text-align:center}.nav:first-letter{font-size:19px}.status{display:none}main{padding:14px}.split{grid-template-columns:1fr}.quick span{display:none}}
</style></head><body><div id="root"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE: leave blank for local demo. We will fill this in later.
const firebaseConfig={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""};
let firebaseEnabled=!!firebaseConfig.projectId;
if(firebaseEnabled){const app=initializeApp(firebaseConfig); getFirestore(app);}

const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);
const buttons=[["tardy","⏰","Tardy","event"],["phone","📱","Phone","event"],["talking","🗣️","Excessive Talking","event"],["outseat","🚶","Out of Seat","event"],["sleeping","😴","Sleeping","event"],["refusal","🚫","Not Working","event"],["restroom","🚻","Restroom","timed"]];
const seed={classes:[{id:"c1",name:"Period 1 – Honors Precalculus",studentIds:["s1","s2","s3"]}],students:[{id:"s1",name:"Abby Smith"},{id:"s2",name:"Ben Jones"},{id:"s3",name:"Chris Brown"}],buttons:buttons.map(([id,icon,label,type])=>({id,icon,label,type})),events:[],notes:[],schoolDays:[],totalSchoolDays:180,gradeCourses:[]};
let data;try{data={...seed,...JSON.parse(localStorage.teacherDashboardV1||"{}")}}catch{data=structuredClone(seed)}
let page="live",selected=null;
function save(){localStorage.teacherDashboardV1=JSON.stringify(data)}
function mutate(fn){fn(data);save();render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function nav(){return [["live","🏠","Live Class"],["students","👥","Students & Classes"],["calendar","🗓️","Calendar"],["buttons","⚡","Quick Buttons"],["grades","📚","Grades"],["reports","📊","Reports"],["settings","⚙️","Settings"]].map(x=>`<button class="nav ${page===x[0]?"active":""}" data-page="${x[0]}">${x[1]} ${x[2]}</button>`).join("")}
function currentClass(){return data.classes[0]}
function activeEvents(){return data.events.filter(e=>e.type==="timed"&&!e.end)}
function render(){
 $("#root").innerHTML=`<div class="app"><aside><h1>🎓 Teacher<br>Dashboard</h1>${nav()}<div class="status">${firebaseEnabled?"🟢 Firebase connected":"🟡 Local demo mode"}</div></aside><main>${toastHTML()}${pageHTML()}</main></div>${selected?modalHTML():""}`;
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
 bind();
}
let toast="";
function toastHTML(){return toast?`<div class="toast">${esc(toast)} <button onclick="window.clearToast()">×</button></div>`:""}
window.clearToast=()=>{toast="";render()}
function pageHTML(){return ({live:live,students:students,calendar:calendar,buttons:quickButtons,grades:grades,reports:reports,settings:settings})[page]()}
function live(){
 const cls=currentClass(), roster=data.students.filter(s=>cls.studentIds.includes(s.id)), active=activeEvents();
 return `<header><div><h2>${esc(cls.name)}</h2><p>${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</p></div><div class="card">🚪 ${active.length} currently out</div></header>
 ${active.length?`<div class="alert"><b>Students currently out:</b>${active.map(e=>{let s=data.students.find(x=>x.id===e.studentId);return `<div style="padding:8px 0">${esc(s?.name)} — ${e.icon} ${e.label} <span data-timer="${e.start}"></span> <button onclick="window.returnEvent('${e.id}','returned')">↩ Return</button></div>`}).join("")}</div>`:""}
 <div class="roster">${roster.map(s=>{let out=active.find(e=>e.studentId===s.id);return `<article class="student"><h3>${esc(s.name)}</h3>${out?`<div class="out">🟡 OUT — <span data-timer="${out.start}"></span><button onclick="window.returnEvent('${out.id}','returned')">Return</button></div>`:`<div class="quick">${data.buttons.map(b=>`<button onclick="window.record('${s.id}','${b.id}')">${b.icon}<span>${esc(b.label)}</span></button>`).join("")}</div>`}<button class="noteBtn" onclick="window.note('${s.id}',null)">📝 Add Note</button></article>`}).join("")}</div>`;
}
function students(){return `<header><h2>Students & Classes</h2></header><div class="split"><section class="card"><h3>Students</h3><div class="add"><input id="newStudent" placeholder="Student name"><button onclick="window.addStudent()">Add</button></div>${data.students.map(s=>`<p>${esc(s.name)}</p>`).join("")}</section><section class="card"><h3>Classes</h3><div class="add"><input id="newClass" placeholder="Class name"><button onclick="window.addClass()">Add</button></div>${data.classes.map(c=>`<div class="card"><b>${esc(c.name)}</b><div>${data.students.map(s=>`<label class="small"><input type="checkbox" ${c.studentIds.includes(s.id)?"checked":""} onchange="window.roster('${c.id}','${s.id}',this.checked)"> ${esc(s.name)}</label><br>`).join("")}</div></div>`).join("")}</section></div>`}
function calendar(){return `<header><h2>Calendar & Keystone Tracking</h2></header><section class="card"><h3>School Day Calendar</h3><p>Map dates to instructional day numbers.</p><div class="add"><input id="schoolDate" type="date"><input id="schoolDay" type="number" placeholder="School day #"><button onclick="window.addSchoolDay()">Add</button></div><table><tr><th>Date</th><th>Day #</th></tr>${[...data.schoolDays].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${x.date}</td><td>${x.day}</td></tr>`).join("")}</table></section><section class="card"><h3>Assignment Tracking</h3><p class="small">The data structure is ready for enrollment periods. We'll build the full one-click enrolled/unenrolled report next.</p></section>`}
function quickButtons(){return `<header><h2>Quick Buttons</h2></header><section class="card"><h3>Create a Quick Button</h3><div class="add"><input id="qbIcon" value="⚡" style="width:70px"><input id="qbLabel" placeholder="Button name"><select id="qbType"><option value="event">One-time event</option><option value="timed">Timed event</option></select><button onclick="window.addButton()">Add</button></div></section><div class="reportgrid">${data.buttons.map(b=>`<div class="card">${b.icon} <b>${esc(b.label)}</b><br><span class="small">${b.type}</span><button style="float:right" onclick="window.deleteButton('${b.id}')">Delete</button></div>`).join("")}</div>`}
function grades(){return `<header><h2>Grades & Analysis</h2></header><div class="add"><input id="courseName" placeholder="Course name"><button onclick="window.addCourse()">Add Course</button></div>${data.gradeCourses.map(c=>gradeCourse(c)).join("")}`}
function gradeCourse(c){let total=c.components.reduce((a,x)=>a+x.weight,0);return `<section class="card"><h3>${esc(c.name)}</h3><div class="add"><input id="comp-${c.id}" placeholder="Marking period/component"><input id="weight-${c.id}" type="number" placeholder="Weight %"><button onclick="window.addComponent('${c.id}')">Add</button></div><p>Total configured weight: <b>${total}%</b></p><table><tr><th>Student</th>${c.components.map(x=>`<th>${esc(x.name)} (${x.weight}%)</th>`).join("")}<th>Weighted</th></tr>${data.students.map(s=>{let vals=c.grades[s.id]||{};let weighted=c.components.reduce((a,x)=>a+(Number(vals[x.id])||0)*x.weight/100,0);return `<tr><td>${esc(s.name)}</td>${c.components.map(x=>`<td><input class="grade" value="${esc(vals[x.id]??"")}" onchange="window.setGrade('${c.id}','${s.id}','${x.id}',this.value)"></td>`).join("")}<td>${weighted.toFixed(1)}</td></tr>`}).join("")}</table></section>`}
function reports(){let options=data.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");let sid=window.reportStudent||data.students[0]?.id;let s=data.students.find(x=>x.id===sid),ev=data.events.filter(e=>e.studentId===sid),notes=data.notes.filter(n=>n.studentId===sid);return `<header><h2>Reports</h2></header><section class="card"><select onchange="window.reportStudent=this.value;render()">${options}</select><h3>${esc(s?.name||"")}</h3><p><b>Total events:</b> ${ev.length}</p><div class="reportgrid">${data.buttons.filter(b=>b.type==="event").map(b=>`<div class="stat">${b.icon}<b>${ev.filter(e=>e.buttonId===b.id).length}</b><span>${esc(b.label)}</span></div>`).join("")}</div><h4>Out of Class</h4>${ev.filter(e=>e.type==="timed").map(e=>`<p>${e.icon} ${e.label} — ${new Date(e.start).toLocaleString()} ${e.end?"to "+new Date(e.end).toLocaleString():"(still open)"}</p>`).join("")||"<p>None recorded.</p>"}<h4>Notes</h4>${notes.map(n=>`<p>📝 ${esc(n.text)} <span class="small">${new Date(n.created).toLocaleString()}</span></p>`).join("")||"<p>None recorded.</p>"}</section>`}
function settings(){return `<header><h2>Settings</h2></header><section class="card"><label>Total school days for Keystone tracking<br><input type="number" value="${data.totalSchoolDays}" onchange="window.setTotalDays(this.value)"></label></section><section class="card"><button onclick="window.resetData()">Reset local demo data</button></section>`}
function modalHTML(){return `<div class="modalbg"><div class="modal"><h3>📝 Note for ${esc(selected.student.name)}</h3><textarea id="noteText" placeholder="Optional context or general note..."></textarea><div><button onclick="window.saveNote()">Save Note</button><button onclick="window.closeNote()">Cancel</button></div></div></div>`}
function bind(){document.querySelectorAll("[data-timer]").forEach(el=>{let tick=()=>{let sec=Math.floor((Date.now()-new Date(el.dataset.timer))/1000);el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`};tick();setInterval(tick,1000)})}
window.record=(sid,bid)=>{let s=data.students.find(x=>x.id===sid),b=data.buttons.find(x=>x.id===bid);let e={id:uid(),studentId:sid,classId:currentClass().id,buttonId:bid,label:b.label,icon:b.icon,type:b.type,start:new Date().toISOString(),end:null};data.events.push(e);save();toast=`${b.icon} ${b.label} recorded for ${s.name}.`;if(b.type==="event"){selected={student:s,eventId:e.id}}render()}
window.returnEvent=(id,status)=>{let e=data.events.find(x=>x.id===id);e.end=new Date().toISOString();e.status=status;save();render()}
window.note=(sid,eid)=>{selected={student:data.students.find(x=>x.id===sid),eventId:eid};render()}
window.closeNote=()=>{selected=null;render()}
window.saveNote=()=>{let text=$("#noteText").value.trim();if(text)data.notes.push({id:uid(),studentId:selected.student.id,eventId:selected.eventId,text,created:new Date().toISOString()});save();selected=null;render()}
window.addStudent=()=>{let name=$("#newStudent").value.trim();if(name){data.students.push({id:uid(),name});save();render()}}
window.addClass=()=>{let name=$("#newClass").value.trim();if(name){data.classes.push({id:uid(),name,studentIds:[]});save();render()}}
window.roster=(cid,sid,on)=>{let c=data.classes.find(x=>x.id===cid);c.studentIds=on?[...c.studentIds,sid]:c.studentIds.filter(x=>x!==sid);save()}
window.addSchoolDay=()=>{let date=$("#schoolDate").value,day=Number($("#schoolDay").value);if(date&&day){data.schoolDays.push({date,day});save();render()}}
window.addButton=()=>{let label=$("#qbLabel").value.trim();if(label){data.buttons.push({id:uid(),icon:$("#qbIcon").value||"⚡",label,type:$("#qbType").value});save();render()}}
window.deleteButton=id=>{data.buttons=data.buttons.filter(x=>x.id!==id);save();render()}
window.addCourse=()=>{let name=$("#courseName").value.trim();if(name){data.gradeCourses.push({id:uid(),name,components:[],grades:{}});save();render()}}
window.addComponent=cid=>{let name=$(`#comp-${cid}`).value.trim(),weight=Number($(`#weight-${cid}`).value);if(name&&weight){data.gradeCourses.find(x=>x.id===cid).components.push({id:uid(),name,weight});save();render()}}
window.setGrade=(cid,sid,coid,val)=>{let c=data.gradeCourses.find(x=>x.id===cid);c.grades[sid]??={};c.grades[sid][coid]=val;save();render()}
window.setTotalDays=v=>{data.totalSchoolDays=Number(v);save()}
window.resetData=()=>{if(confirm("Reset all local data?")){data=structuredClone(seed);save();render()}}
render();
</script></body></html>
